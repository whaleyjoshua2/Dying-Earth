# Spec section 4.2, amended by ticket #26 (version 0.02): nine Nation States. Russia is cut out of
# Europe and the Middle East out of Asia; each parent loses the population that leaves and one Size.
# Population in hundreds of millions. Education Level from UN 2023 schooling data.
# Neighbours are symmetric; each edge is listed on both states. Rows stay in the engine's order.
# start_facilities (ticket #24): what stands when the game begins, as many as the Industry Level,
# chosen by the Resource Lean. They come with the state whoever takes it. The Faction start states
# get a Launch Site on top.
# influence (ticket #34, version 0.03): what the state adds to its controller's Allotment each turn,
# from 2023 GDP and military spending shares; plus one for every Industry Level raised above the card.
# gdp (ticket #35): world GDP share in tenths (2023); a controlled state makes gdp x Industry Level / 10
# Ducats a turn, and a Bank there adds 4 x gdp / 10.

# unrest (ticket #52, version 0.05): the Unrest the state starts with, 0 to 10. Every state starts calm.

