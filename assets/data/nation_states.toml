# Ticket #126 (version 0.07.2): every Region carries a colour of its own. The designer, looking at
# the mask generator's preview: "i'd like neutral countries the default colors in this latest mask
# test. shown on the start screen and on the globe." So a Region nobody holds is tinted in its own
# colour on the Earth Map and every Region is on the start screen, where nothing is held yet; a held
# Region wears its controller's Faction colour as before. The preview reads these same numbers, so
# the picture the generator draws and the board a player sees agree.
#
# Six of the preview's colours sat within a CIELAB distance of 25 of a Faction's -- Brazil against
# the Prospectors at 8 was the same orange -- so a neutral Region could read as a held one. Those six
# were moved, at the designer's word, to hues that clear every Faction by 29 or more and their own
# neighbours by 30 or more: Brazil to salmon, Iran to cream, Australia to lavender, the Arabian
# Peninsula to a blue-violet (still violet, as asked, pushed off the Arkwrights' purple), China to
# brick, Egypt to pale rose. India and the United States are both green, 11 apart, and were left,
# being on opposite sides of the globe and clear of every Faction.
# Version 0.07.2 (ticket #122): every Region is named for its Nation -- the power that leads it --
# and carries that Nation's flag as a two-letter code into assets/flags/. The geographic names the
# twelve were charted under stay in the comment above each block, since they still say what ground
# a Region covers, and ticket #125 is about to redraw that ground along real borders. The choice of
# Nation is the designer's: China, India, the United States, Brazil, Russia, Australia, the European
# Union, Iran, Egypt, Nigeria, Indonesia and Mexico. Ids are unchanged: south_asia is still the id
# of the Region now called India, so nothing that names a Region by id -- saves, tests, the shot
# aids -- moved.
# Spec section 4.2, amended by ticket #26 (version 0.02) and ticket #53 (version 0.05): twelve
# Nation States. Africa is split at the Sahara; Asia becomes East Asia, South Asia and South-East
# Asia; Central America and the Caribbean are cut out of North America. Antarctica stays off the
# list (ticket #44): it is Earth's three Colony Slots.
#
# Population in hundreds of millions, from 2023 figures; every split shares out its parent's people
# rather than inventing more. Education Level from UN 2023 schooling data. Neighbours are symmetric;
# each edge is listed on both states. Rows stay in the engine's order.
# start_facilities (ticket #24): what stands when the game begins, as many as the Industry Level,
# chosen by the Resource Lean. They come with the state whoever takes it. The Faction start states
# get a Launch Site on top.
# influence (ticket #34): what the state adds to its controller's Allotment each turn, from 2023 GDP
# and military spending shares; plus one for every Industry Level raised above the card. A split
# shares out its parent's figure exactly, so the Influence economy is unchanged by ticket #53.
# gdp (ticket #35): world GDP share in tenths (2023); a controlled state makes gdp x Industry Level
# / 10 Ducats a turn, and a Bank there adds 4 x gdp / 10. Splits share out the parent's figure too.
# unrest (ticket #52): the Unrest the state starts with. Every state starts calm.

# Ticket #53 (version 0.05): Neutral Development. A neutral Nation State (not Controlled, not
# Occupied) below `max_level` raises its Industry Level by one every `turns` turns of unbroken
# neutrality, and brings one idle Facility of its own online at the same moment. The clock is per
# state and runs from the turn it was last neutral, so a state taken and then freed starts a fresh
# count. Nothing develops while the Temperature stands at `stops_at_temperature` or above, nor
# while the state's Unrest is at `no_development_at` (unrest.toml) or more. The designer's names
# for these three are development_turns, development_max_level and
# development_stops_at_temperature; inside their own table the prefix would only repeat itself.

# Ticket #54 (version 0.05): the Strip Permit, the second clause of the Prospectors' signature rule.
# Free, once per Nation State ever: for `turns` turns every Facility there produces `multiplier`
# times what it would; when it ends the state's Baseline Emissions rise by `baseline_rise` for good
# and its Unrest by `unrest`. The designer named these strip_permit_turns, strip_permit_multiplier,
# strip_permit_baseline_rise and strip_permit_unrest; inside their own table the prefix would only
# repeat itself, as with [development] on ticket #53.
# Ticket #56 (version 0.05): build slots. A state has Size + Industry Level + `base_slots` of them,
# less the coastal slots the sea has taken. Its START slots (Size + base_slots + the Industry Level
# on its card) hold `coastal_per_exposure` x Coastal Exposure coastal slots, never more than the
# start slots minus one; the rest are inland, and every slot a raise of the Industry Level adds is
# inland. The sea takes only coastal slots.
base_slots = 3
# Ticket #70 (version 0.05.5): 3 to 2, moving fifteen of the world's 49 coastal slots inland at the
# start (34 remain); Europe's Refinery and North America's Factory stand inland from turn 1.
coastal_per_exposure = 2

[strip_permit]
turns = 3
multiplier = 2.0
baseline_rise = 0.2
unrest = 3.0

[development]
turns = 9
max_level = 4
stops_at_temperature = 2.5

