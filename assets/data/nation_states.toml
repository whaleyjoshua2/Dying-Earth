# Spec section 4.2, amended by ticket #26 (version 0.02) and ticket #53 (version 0.05): twelve
# Nation States. Africa is split at the Sahara; Asia becomes East Asia, South Asia and South-East
# Asia; Central America and the Caribbean are cut out of North America. Antarctica stays off the
# list (ticket #44): it is Earth's three Colony Slots.
#
# Population in hundreds of millions, from 2023 figures; every split shares out its parent's people
# rather than inventing more. Education Level from UN 2023 schooling data. Neighbours are symmetric;
# each edge is listed on both states. Rows stay in the engine's order.
# start_facilities (ticket #24): what stands when the game begins, as many as the Industry Level,
# chosen by the Resource Lean. They come with the state whoever takes it. The Faction start states
# get a Launch Site on top.
# influence (ticket #34): what the state adds to its controller's Allotment each turn, from 2023 GDP
# and military spending shares; plus one for every Industry Level raised above the card. A split
# shares out its parent's figure exactly, so the Influence economy is unchanged by ticket #53.
# gdp (ticket #35): world GDP share in tenths (2023); a controlled state makes gdp x Industry Level
# / 10 Ducats a turn, and a Bank there adds 4 x gdp / 10. Splits share out the parent's figure too.
# unrest (ticket #52): the Unrest the state starts with. Every state starts calm.

# Sub-Saharan Africa: the continent below the Sahara, about 1.2 billion people, little industry,
# the youngest population on the map and the least schooling.
[[state]]
id = "sub_saharan_africa"
name = "Sub-Saharan Africa"
population = 11.4
industry_level = 1
resource_lean = "materials"
baseline_emissions = 0.3
education_level = 0.7
size = 3
coastal_exposure = 1
neighbours = ["north_africa", "middle_east"]
start_facilities = ["factory"]
influence = 1
gdp = 2
unrest = 0.0

