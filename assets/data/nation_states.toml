name = "Nigeria"
flag = "ng"
population = 11.4
industry_level = 1
resource_lean = "materials"
baseline_emissions = 0.3
education_level = 0.7
size = 3
coastal_exposure = 1
neighbours = ["north_africa", "middle_east"]
start_facilities = ["factory"]
influence = 1
gdp = 2
unrest = 0.0

