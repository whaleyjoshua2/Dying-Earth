# Japan and Korea: Japan, South Korea and North Korea, about 200 million people, the second rich
# Pacific power, an island Region with the most exposed coast on the map. Cut out of East Asia on
# ticket #125 (version 0.07.2) with a 2.0 / 6 / 1 share of its parent's population, GDP and
# Influence. The rest of its card is set by hand and written here for the designer to veto: the
# Industry Level is China's, the Education Level is the highest on the map after Europe and North
# America, it leans Energy since it has no ore or oil of its own, and it starts with two Factories
# and a Power Plant -- as many start Facilities as its Industry Level, the rule every card obeys,
# and no start Lab, since ticket #69 gave those to North America and South-East Asia alone.
