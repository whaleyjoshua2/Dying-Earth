# Spec section 5.3. Ships and Armies share one stat line shape.
#
# Ticket #332 (version 0.09.0): `widgets` replaces `build_turns` on every row, at four Widgets for
# every turn the build took (a Battleship 8, everything else 4). A Ship completes at the Resolution
# its Shipyard's Colony has made it the Widgets, an Army at its place's; the Arkwrights' Ship
# discount reaches the figure as it reaches the Materials.

[[unit]]
id = "colony_ship"
name = "Colony Ship"
materials = 30
widgets = 4
energy_upkeep = 1
strength = 0
hit_points = 3
pursuit = 0
carries_colonists = 4
# Version 0.04 (ticket #43): a Colony Ship carries Colonists only; the Carrier carries the Army.
carries_army = false
# Ticket #87 (version 0.06.0): every Ship carries its own Fuel in a tank of this size, filled at
# the yard and refilled only by a Refuel order at a Body with a station of its own.
tank = 30

[[unit]]
id = "frigate"
name = "Frigate"
materials = 25
widgets = 4
energy_upkeep = 2
strength = 3
hit_points = 4
pursuit = 4
carries_colonists = 0
carries_army = false
tank = 30

[[unit]]
id = "battleship"
name = "Battleship"
materials = 50
widgets = 8
energy_upkeep = 4
strength = 7
hit_points = 8
pursuit = 1
carries_colonists = 0
# Version 0.04 (ticket #43): a Battleship fights; it carries no Army.
carries_army = false
tank = 30

# Version 0.04 (ticket #43): the transport for one Army and nothing else. Unarmed, so it needs an
# escort, and a target for Intercept like a Colony Ship. Ticket #326 (version 0.08.8): the escort
# is real now -- while a warship of its party stands engaged, hits land on the warships and an
# unarmed hull is neither struck nor pursued.
[[unit]]
id = "carrier"
name = "Carrier"
materials = 30
widgets = 4
energy_upkeep = 2
strength = 0
hit_points = 4
pursuit = 0
carries_colonists = 0
carries_army = true
tank = 30

[[unit]]
id = "army"
name = "Army"
materials = 25
widgets = 4
energy_upkeep = 2
strength = 4
hit_points = 5
pursuit = 2
carries_colonists = 0
carries_army = false

# Ticket #343 (version 0.09.1): the Missile Carrier, the hull that carries one Warhead and fires it
# with a Launch. Appended LAST because the tables are indexed by the enum's discriminant. Dearer
# than a Battleship (50 / 8) because it ends games, and frailer than a Colony Ship: no strength, no
# pursuit, three hit points. It is a Ship but NOT a warship -- it holds no Orbital Control, it
# blockades nothing, and under ticket #326's escort rule it is struck only once its party has no
# warship left engaged, which is by decision the whole counter to it. `needs_tech` is the first one
# a unit row has ever carried.
[[unit]]
id = "missile_carrier"
name = "Missile Carrier"
materials = 60
widgets = 16
energy_upkeep = 2
strength = 0
hit_points = 3
pursuit = 0
carries_colonists = 0
carries_army = false
tank = 30
needs_tech = "missile_technology"

# Ticket #334 (version 0.09.0): an Army is raised from people. In a Region a raise takes
# `population_each` units of the Region's population -- one unit, one million people since ticket
# #333 -- at the order, on top of its Materials and Widgets, whatever the Army's strength, and is
# refused where the Region has not got it. At a Colony it takes `colonists_each` Colonists, refused
# where fewer than one more than that live there, so the Core Module is never emptied; the Module
# slot the Colonist bought goes with them. The Standing Army takes nobody. The people are gone: a
# destroyed Army returns nobody. The designer: "armies from people too".
[army]
population_each = 1.0
colonists_each = 1

[repair]
materials_per_point = 5

# Ticket #295 (version 0.08.6): the disengage roll. After every round of a Battle a damaged unit
# leaves with chance (damage / hit points) / divisor; an undamaged unit never leaves, and Evade's
# flat half is its own rule. The First Playable wrote 2 into the code and never tuned it; the
# reviews of 2026-09-19 called the escape "the accident that decides Regions", and the designer
# nudged it down: "a third". Measured before the nudge, twenty seeds with the Custodians first:
# 12 units escaped over 37 Battles, 11 of those Battles with an escape in them.
[disengage]
divisor = 3.0

# Ticket #327 (version 0.08.8): the melee's shape, which the First Playable wrote into the code as
# three rounds of three hit rolls for the whole fight, however many hulls stood in it -- so nine
# hits was every Battle's ceiling and a Battleship (8 hit points) could not die in a turn. Now a
# Ship melee rolls once a round for every engaged armed unit across every party (warships and
# Batteries), never fewer than `rolls`; a ground melee rolls `rolls`, where one or two Armies a
# side make three about one a unit already. `rounds` is both. Measured before: 226 Battles over
# eighty games, two warships lost.
[melee]
rounds = 3
rolls = 3
# Ticket #339 (version 0.09.0): the whole-battle odds are MEASURED, not derived. `odds_trials`
# runs of the melee are fought on a copy of the board, from `odds_seed` -- the figure's own seed
# and never the game's, so asking what the odds are cannot move a seeded game by one roll.
# A thousand trials read a percentage to about a point and a half either way, and cost a
# millisecond or two; raise it for a steadier figure, lower it for a cheaper one.
odds_trials = 1000
odds_seed = 339
# Ticket #346 (version 0.09.1): a Battle costs Fuel. Every Ship named in any party of a SHIP melee
# pays `battle_fuel` out of its own tank, once per Battle -- struck or not, armed or not, whichever
# side it is on and whether or not it opened the fight. A Battery pays nothing, having no tank, and
# an Army is untouched: a ground melee is not a space Battle.
#
# 2, which is a third of the cheapest leg in the game (the Moon's 6) and a fifteenth of a tank.
# Two is also the bar a warship must hold to hold an orbit at all (see below), so a hull holds an
# orbit exactly as long as it could still fight for it.
battle_fuel = 2
# A hull whose tank held LESS than `battle_fuel` when the charge was taken fights that Battle at
# `floor(strength x dry_strength_share)`, whichever side it is on. All or nothing: a hull short by
# one Fuel is penalised exactly as hard as one at nought. It has no clock of its own -- the penalty
# is read off the tank at every Battle -- so a hull that never refuels fights halved every turn and
# fights whole again the turn after it fills. Half of nought is nought, so the Colony Ship, the
# Carrier and the Missile Carrier (strength 0) are untouched by it.
dry_strength_share = 0.5

# Ticket #296 (version 0.08.6): a Region's defence is its people. Its Standing Army adds
# `constabulary` while a working Constabulary stands there and `calm` while Unrest is under the
# Standing Army's threshold. Ticket #302 (version 0.08.6): as DEFENCE -- while it defends, and never
# as hit points -- at the designer's word: "begin by moving the constabulary and unrest bonuses to
# defense". Its strength and hit points are Industry + 1 plus the steps it has armed by:
# `threat_steps` at the Income a threat begins (a built Army next door, a neighbour Occupied), once
# per threat episode, where a Levy used to be raised and stood down; `held_step` for every attack a
# neutral holds against. No ceiling. A raised Army is worth its home's Industry + 1, fixed at the
# raise; a Colony's the rounded average Industry of its Faction's Regions + 1.
# Ticket #318 (version 0.08.8): `respawn_incomes` is how many Incomes after a Standing Army's
# death it is raised again, at strength one -- two since ticket #282, so a won Battle opens a
# window; a code literal until this version.
[standing_army]
constabulary = 1
calm = 1
threat_steps = 2
held_step = 1
respawn_incomes = 2

# Ticket #297 (version 0.08.6): Dig In, the third live stance an Army has. Dug in, an Army adds
# `defence` to its strength while it defends and never rolls to disengage; its hit points do not
# follow the bonus ("no bonus to hitpoints"). It cannot march or board a Carrier until its stance
# is changed and the turn has passed. A neutral Region's own Armies are always dug in.
[dig_in]
defence = 2

# Ticket #86 (version 0.06.0): a warming Earth fills the Colony Ships. A Colony Ship lifting at
# Earth may take `per_step` Colonist beyond its capacity for every full `step` degrees the
# Temperature stands above `above`, at most `cap` extra, the same for every Faction. At arrival
# each Colonist above the safe capacity dies with a chance of `death_chance_per_extra` times the
# number of extras, rolled once. Antarctica by sea carries no crowd.
[crowding]
above = 1.8
step = 0.2
per_step = 1
cap = 4
death_chance_per_extra = 0.05

# Ticket #343 (version 0.09.1): everything a Launch reads. It lives here, beside the carrier's own
# row, rather than in a file of its own: the weapon is a unit, so its figures are units figures --
# what it destroys, whom it kills and what it costs to load again are one rule, not three. Nothing
# here has a default in the code, so a missing figure refuses the whole table at load.
[nuke]
# Every building at the struck place rolls this, independently: a nuke is not gentler on a city
# than the Occupation's three-turn siege, which rolls 0.25 (`influence.destruction_chance`, and
# untouched by this ticket). The Core Module and the Archive are spared, so a place is gutted and
# never erased from the board.
destruction_chance = 0.60
# The share of the place's people that dies, drawn once per strike from the game's own RNG: a
# Region's population, a Colony's Colonists.
people_min = 0.40
people_max = 0.60
# At a Region only: the Industry Levels it loses, floored at the state card's own figure, so a
# Region never falls below the board it started on. It may be raised again by the ordinary order:
# this is a setback, not ruin.
industry_lost = 1
# Rung 4, a rung above the three the game had. A weight, not an enum, so it is data: it breaks a
# non-aggression Accord and leaves the permanent scar, both through `offend_by`.
offence = 4
# ON EARTH ONLY, which `charge_war` already enforces, at the designer's word: "I don't see how a
# nuke on mars could possibly effect the climate on earth." Ten buildings' worth of war ppm at the
# existing 2.0 a building, so one strike is felt in the air; and a permanent rise in the Natural
# Sink, since the Sink is Earth's own forests and oceans and the soot dims them.
war_ppm = 20.0
sink_rise = 0.25
# A Rearm at a Shipyard of the firing Faction: most of a second hull, so firing is a commitment and
# a carrier that has fired is out of the war for the round trip home.
rearm_materials = 40
rearm_widgets = 8
