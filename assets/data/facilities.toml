# Spec section 5.1. Built in a Nation State; each occupies one build slot.
# `produces` is per turn before yields and multipliers; a Research Lab uses the formula in 12.1.

[[facility]]
id = "factory"
name = "Factory"
materials = 20
build_turns = 1
energy_upkeep = 2
produces = { resource = "materials", amount = 4 }
emissions = 1.0

[[facility]]
id = "power_plant"
name = "Power Plant"
materials = 25
build_turns = 2
energy_upkeep = 0
produces = { resource = "energy", amount = 6 }
emissions = 1.5

[[facility]]
id = "refinery"
name = "Refinery"
materials = 20
build_turns = 1
energy_upkeep = 3
produces = { resource = "fuel", amount = 3 }
emissions = 1.5

[[facility]]
id = "research_lab"
name = "Research Lab"
materials = 25
build_turns = 1
energy_upkeep = 3
produces = { resource = "research", amount = 2 }
emissions = 0.0

[[facility]]
id = "launch_site"
name = "Launch Site"
materials = 30
build_turns = 2
energy_upkeep = 2
does = "lifts Pioneers and Armies from here to orbit and to a Space Station over Earth, and a station over Earth can be built from here"
emissions = 0.0

# Ticket #35 (version 0.03). Its output is 4 x the state's gdp / 10 Ducats; `amount` here is that 4.
[[facility]]
id = "bank"
name = "Bank"
materials = 25
build_turns = 1
energy_upkeep = 2
produces = { resource = "ducats", amount = 4 }
emissions = 0.0

# Ticket #36 (version 0.03). Adds to its controller's Allotment and raises its state's standing for
# its controller each turn, while it stands and is online. Any number may stand in one state.
[[facility]]
id = "embassy"
name = "Embassy"
materials = 30
build_turns = 1
energy_upkeep = 2
emissions = 0.0
influence_allotment = 2
standing_per_turn = 2

# Ticket #52 (version 0.05): the Constabulary. At most one per Nation State, buildable by any
# Faction. It lowers its state's Unrest by 1 every turn it stands and is online, whatever else
# happened, and damps every climate-source and refugee rise there by 1 on top of the green Techs.
[[facility]]
id = "constabulary"
name = "Constabulary"
materials = 25
build_turns = 1
energy_upkeep = 2
does = "takes 1 off this state's Unrest a turn, halves what the climate and an Agitate add to it, and adds 5 to what a rival must reach to take this state (10 with Civil Defense)"
emissions = 0.0

# Ticket #54 (version 0.05): the Scrubber, the Custodians' signature Facility, which replaces
# Restoration. Only they build it, only in a Nation State they control, and it takes NO build slot
# (`no_slot`). While it stands and is online it enlarges the Natural Sink by `sink_per_turn` ppm in
# that Climate phase, which counts as removal for its controller's Blame, and it takes 1 off its
# state's Unrest every turn (`unrest.toml`, `scrubber_fall`). It is destroyed outright if the state
# changes hands. How many one state may hold is `[scrubber]` below.
[[facility]]
id = "scrubber"
name = "Scrubber"
materials = 30
build_turns = 2
energy_upkeep = 3
does = "+3.0 ppm on the Natural Sink and 1 off this state's Unrest a turn, counted as its holder's removal; no build slot; destroyed if this state changes hands"
emissions = 0.0
sink_per_turn = 3.0
no_slot = true

# Ticket #56 (version 0.05): the Sea Wall. It needs Coastal Engineering, and at most one may stand
# in a Nation State. While it stands and is working it absorbs the state's next Sea Level threshold
# of any kind -- scheduled, a Storm Surge applied early, or the Ice Sheets Break -- so no coastal
# slot is lost, and it is destroyed doing it. Ticket #77 (version 0.05.5): it takes NO build slot
# (`no_slot`), as the Scrubber does, and costs 20 Materials, after three rounds measured over
# twenty seeds: in a coastal slot at 35 with the AI picking Coastal Engineering late, no wall was
# ever built (the sea had taken every coastal slot by the time the Tech came); with no slot at 35
# and the Tech picked early, 220 to 372 a batch; in a coastal slot at 20, 30 to 48. The pick lists
# in ai.toml settle the timing.
[[facility]]
id = "sea_wall"
name = "Sea Wall"
materials = 20
build_turns = 2
energy_upkeep = 1
does = "holds every Sea Level threshold off this state while it works, and a Storm Surge it holds cuts its coastal Facilities' output by 30% for one turn; no build slot, one to a state; each rise held adds 0.5 Materials a turn to its keep"
emissions = 0.0
needs_tech = "coastal_engineering"
no_slot = true

# Ticket #185 (version 0.08.0): the School. At most one per Nation State, buildable by any Faction.
# While it stands and is online it raises its state's Education Level by `per_turn` a turn, to
# `ceiling`; when it stops, the figure falls back at the same rate and stops at the card's own.
# Priced as a Research Lab, at two turns rather than one because it is infrastructure and should not
# be an instant answer to a rival's Influence push.
[[facility]]
id = "school"
name = "School"
materials = 25
build_turns = 2
energy_upkeep = 2
does = "raises this state's Education Level 0.20 a turn, to 2.0; it falls back at the same rate when the School stops"
emissions = 0.0

# Tickets #181 to #186 (version 0.08.0): the four Unique Facilities, one per Faction. Each REPLACES
# a common building on its Faction's build list at the common price -- the same Materials, the same
# build turns, the same upkeep, the same output, the same slot -- so every row below is its common
# sibling's row with a new id and a new name. The clause each carries is in code, not here, because
# every one of them reads something no facility row can say (the Venture Capital Fund's balance, the
# Pioneers a turn lifted, the holder's whole Energy bill, a flat Ducat).
#
# Order matters: `Tables::facility` indexes FacilityKind by discriminant, so these four sit after
# `school` here exactly as they do in the enum.

# Ticket #182: the Prospectors' Bank. Banks 1% of the Venture Capital Fund's balance into the Fund
# each turn while it is online, one Investment Bank per Region paying, and pays its Ducats in full.
[[facility]]
id = "investment_bank"
name = "Investment Bank"
materials = 25
build_turns = 1
energy_upkeep = 2
does = "banks 1% of the Venture Capital Fund's balance back into it each turn, never less than 1 across all your Investment Banks"
produces = { resource = "ducats", amount = 4 }
emissions = 0.0

# Ticket #183: the Arkwrights' Launch Site. Pays +1 Influence into next turn's Allotment for every
# Pioneer it lifts off Earth -- onto a Ship in orbit or a station over Earth, never by sea.
[[facility]]
id = "spaceport"
name = "Spaceport"
materials = 30
build_turns = 2
energy_upkeep = 2
does = "does a Launch Site's work, and every Pioneer it lifts off Earth adds 1 Influence to next turn's Allotment"
emissions = 0.0

# Ticket #184: the Archivists' Power Plant. While one stands and is online, its holder pays 75% of
# the total Energy upkeep of everything it owns, the Archive excepted; off the total, once, floored.
[[facility]]
id = "reactor"
name = "Reactor"
materials = 25
build_turns = 2
energy_upkeep = 0
does = "pays three quarters of your whole Energy upkeep, the Archive excepted; a second Reactor is an ordinary power station"
produces = { resource = "energy", amount = 6 }
emissions = 1.5

# Ticket #186: the Custodians' School. Does everything a School does and pays +1 Ducat a turn flat
# while it is online. `academy_ducats` below is that figure.
[[facility]]
id = "academy"
name = "Academy"
materials = 25
build_turns = 2
energy_upkeep = 2
does = "does a School's work and pays 1 Ducat a turn while it is online"
emissions = 0.0

# Ticket #54: the cap on Scrubbers in one Nation State, from its population -- in units of five
# million since ticket #143 (version 0.07.3), so 40 units is the two hundred million each Scrubber wants:
# clamp(round(population / per_population), min, max). Russia at 1.5 gets the floor of 2; South Asia
# at 19.4 gets the ceiling of 10.
[scrubber]
per_population = 40.0
min = 2
max = 10

# Ticket #257 (version 0.08.4): the Sea Wall STANDS. It took one threshold and was destroyed doing
# it from ticket #56 to here; now it holds back every Sea Level threshold that reaches its state --
# the three scheduled ones, the Ice Sheets Break, a Storm Surge -- and is never destroyed. The
# designer's price: each rise it has held adds this many Materials a turn to its keep, paid at
# Income from the Materials the seat makes, the half-Material carried between turns so none is
# lost to rounding. Short of Materials, the wall stands unkept that turn and holds nothing.
# Measured before the change: the computer built 1047 walls in one seating of 20 games -- 52 a
# game -- because every one died absorbing a threshold and was rebuilt; expect that figure to fall
# to about one per coastal state, and coastal slots lost (a median 32 a game) to fall with it.
[sea_wall]
upkeep_per_rise = 0.5

# Ticket #54: Mothball, Restart and Decommission, on any Facility or any Colony Module. A Mothball is
# free and lands at this Resolution; a Restart costs `restart_materials` and takes `restart_turns`;
# a Decommission takes `decommission_turns`, refunds half the building's Materials rounded down, and
# frees its slot. In a Nation State a mothball adds `per_mothball` Unrest and a decommission
# `per_decommission` (`unrest.toml`); in a Colony neither adds anything.
[mothball]
restart_materials = 5
restart_turns = 1
decommission_turns = 1

# Ticket #185: the step and the ceiling. The card figures run 0.70 (Nigeria) to 1.50 (the United
# States and Japan) and no maximum was ever declared, so the designer set one: 2.0. A step of 0.25
# was chosen as the smallest that reliably shows, since a Lab's Research is floored and a lift of
# 0.10 or 0.15 frequently crosses no integer at all.
#
# Ticket #208 (version 0.08.1): 0.20, at the designer's word, and MEASURED against #185's reason
# before it was taken. Walking every Region's ladder from its card figure to the ceiling and
# counting the steps that change a Lab's floored Research:
#
#                    step 0.25              step 0.20
#   neutral Lab      34 of 54 show (63%)    35 of 68 show (51%)
#   Archivist Lab    44 of 54 show (81%)    47 of 68 show (69%)
#
# So #185's worry is half-borne-out and the change is safe. The COUNT of visible lifts barely
# moves -- 34 to 35 -- but they are spread over more turns, so about half a School's turns show
# nothing where a third did before, and the ceiling takes about a quarter longer to reach. The
# worst cases are the United States and Japan, already at 1.50 with little headroom and small
# populations: one visible step in three.
#
# The step and the decay are ONE figure, as the designer's line changed them together: two would
# let a School be built cheaply and mothballed slowly, which is a lever nobody asked for.
[school]
per_turn = 0.20
ceiling = 2.0

# Tickets #182, #184 and #186 (version 0.08.0): the three figures the Unique Facility clauses read.
# The Spaceport's is not here: +1 Influence per Pioneer is the whole of it, and the designer refused
# a cap ("8 a turn is already the brake"), so there is nothing left to tune.
[unique]
# The share of the Venture Capital Fund's balance an Investment Bank banks back into it each turn,
# read BEFORE that turn's banking is added, rounded down, one Investment Bank per Region paying. In
# another Faction's hands the same share applies to that Faction's Ducat income instead.
investment_bank_interest = 0.01
# The floor under that interest, Faction-wide and on ONE building only, so an early Investment Bank
# is never literally worthless. Per building it would have paid about 500 over a game; this pays 36.
investment_bank_floor = 1
# What a Reactor's holder pays of its total Energy upkeep, the Archive excepted. Off the TOTAL and
# rounded down once, never per building: at 2 and 3 Energy a building, per-building rounding turns
# 75% into a 50% and a 33% cut. No stacking -- a second Reactor is an ordinary power station.
reactor_upkeep = 0.75
# What an Academy pays its holder a turn, flat, wherever it stands. Flat rather than scaled by GDP
# (which would make it a second Bank) or by its own Education Level (which would compound with the
# schooling). Run through the largest output multiplier in the game, x1.25, it floors back to 1, so
# a captured Academy pays its captor exactly what it paid its builder.
academy_ducats = 1
# Ticket #239 (version 0.08.3): what a Heliostat makes over a Solar Array, added AFTER the inverse
# square scaling. Before it, the point would be worth 0.43 at Mars and 1.91 at Venus; after it, one
# everywhere, which is what "+1 Energy" reads as.
heliostat_energy = 1
# Ticket #239 (version 0.08.3): what an Exchange pays over a Trade Post, flat and after the output
# multiplier. Flat for the Academy's reason: 1 run through x1.25 floors back to 1, so a captured
# Exchange pays its captor exactly what it paid its builder.
exchange_ducats = 1
# Ticket #239 (version 0.08.3): how many Colonists at a Chorus's own Colony buy one more Influence
# in its holder's Allotment, rounded down. Its OWN Colony rather than its Body, as the Observatory
# reads its own Colony's people. Measured when it was set: the median BIGGEST Colony on the board
# is 4 -- a bare Core Module -- and only the Arkwrights' reach 16 late, so at 6 a Colony must carry
# a Habitat above its Core before a Chorus pays anything at all.
chorus_colonists = 6

[industry_level]
materials = 30
materials_cheap_industry = 15
build_turns = 1
