# Spec section 5.2. Built in a Colony; no slot limit; never emit.
#
# Ticket #332 (version 0.09.0): `widgets` replaces `build_turns` on every row, at four Widgets for
# every turn the build took (the Archive's three turns are 12). A build completes at the Resolution
# its Colony's Widgets reach the figure, served in queue order; a Colony or station makes one a
# turn from its Core Module and four for every working Factory Module (the last row).

[[module]]
id = "mine"
name = "Mine"
materials = 20
widgets = 4
energy_upkeep = 3
produces = { resource = "materials", amount = 4 }
# Version 0.04 (ticket #44): on Earth (Antarctica) a Module emits as its counterpart Facility does.
earth_emissions = 1.0

[[module]]
id = "generator"
name = "Generator"
materials = 25
widgets = 8
energy_upkeep = 0
produces = { resource = "energy", amount = 5 }
earth_emissions = 1.5

[[module]]
id = "refinery"
name = "Refinery"
materials = 20
widgets = 4
energy_upkeep = 3
produces = { resource = "fuel", amount = 3 }
earth_emissions = 1.5

[[module]]
id = "habitat"
name = "Habitat"
materials = 25
widgets = 4
energy_upkeep = 2
does = "holds 4 Colonists (8 with Expanded Habitats)"
# Ticket #80 (version 0.06.0): 8, from 4 (the Arkwrights 12; Expanded Habitats still +2).
# Ticket #207 (version 0.08.1): back to 4, at the designer's word -- "Habs back to 4" -- with
# Expanded Habitats raised to +4 in its place (`habitat_colonists` in techs.toml), so a RESEARCHED
# Habitat holds the 8 an unresearched one held before. The squeeze therefore falls almost entirely
# on the early game: about a third tighter until the Tech lands, which a measured game reaches
# around turn 11, and about 15% tighter after it. The Core Module's flat 4 is untouched, and so is
# the Arkwrights' x1.5, which now carries 6 and 12 where it carried 12 and 15.
holds_colonists = 4

[[module]]
id = "shipyard"
name = "Shipyard"
materials = 35
widgets = 8
energy_upkeep = 4
does = "the only place a Ship can be built"

[[module]]
id = "barracks"
name = "Barracks"
materials = 20
widgets = 4
energy_upkeep = 2
does = "the only place a Colony Army is raised and repaired; holds one"

# Ticket #35 (version 0.03): made 3 Ducats x the Body's Habitat yield. Ticket #90 (version 0.06.0):
# trade is a network. It makes `amount` Ducats per Colonist of its Faction at its Body (stations
# overhead included) plus `[trade_post] per_other_body` for every other Body where the Faction
# holds a Colony, a station or, for Earth, a Nation State; no Habitat yield; the Faction's output
# multiplier applies. One per Faction per Body, on a station or on the ground.
[[module]]
id = "trade_post"
name = "Trade Post"
materials = 25
widgets = 4
energy_upkeep = 2
produces = { resource = "ducats", amount = 2 }

[trade_post]
per_other_body = 3

# Ticket #92 (version 0.06.0): the Mass Driver's figures; its row is the last in the file, in the
# engine's order.
[mass_driver]
fuel_off = 4
fuel_min = 1
mine_bonus = 1

# Ticket #36 (version 0.03). Adds to its holder's Allotment and raises its Colony's standing each turn.
[[module]]
id = "relay"
name = "Relay"
materials = 25
widgets = 4
energy_upkeep = 2
influence_allotment = 1
standing_per_turn = 2

# Ticket #51 (version 0.05): the Archive, which only the Archivists build, at one Colony off Earth,
# never through the ordinary Module build order. Ticket #68 (version 0.05.5): it is one Module,
# `materials` Materials and, since ticket #332, `widgets` Widgets from its own button; the four
# stages are retired.
# Its Energy upkeep is charged only once it is complete: standing, with `[archive] research`
# Research paid into the fund.
[[module]]
id = "archive"
name = "The Archive"
materials = 50
widgets = 12
energy_upkeep = 12

# Ticket #68: the Research the Archive requires in all, paid into the Archive fund at any pace once
# the Module stands; and the share of it the fund may hold BEFORE the Module stands (a quarter: 20).
# At that cap a turn of funding is refused, and the Research stays with the shared Tech.
# Ticket #97 (version 0.07.0): how many Modules a Colony or a Space Station may hold. `base` free,
# and one more for every `per_colonist` Colonists living there. The Archive is exempt and never
# counted, and since ticket #164 so is the Core Module. A mothballed Module keeps its slot and one
# under construction reserves one, exactly as a Facility does in a Nation State.
#
# Ticket #164 (version 0.07.5): `base` is 0, where it was 3. The designer: *"now their construction
# comes with a core module - a new module that provides room for four emigrants no further build
# slots until its populated."* The Core Module is the whole of what a founding gives, and every slot
# after it is bought with a Colonist, so a place that nobody lives in builds nothing. A Colony
# founded with four Colonists has four slots; a station built this turn has none, and can take four
# people at once because its Core Module holds them.
#
# `per_colonist = 1` is not a taste: the designer's rule is that a filled Habitat must always hand
# back at least two slots after paying for its own. The poorest Habitat in the game holds three
# (Phobos and Deimos, Habitat yield 0.5), so one slot per Colonist is the simplest ratio that keeps
# that promise on every Colony Slot. At one per two it would hand back nothing there.
[slots]
base = 0
per_colonist = 1

[archive]
research = 80
banked_before_built = 0.25
# Ticket #192 (version 0.08.0): how many Colonists must live at the place before the Archive may be
# ORDERED. Checked once, at the order; neither the three-turn build nor the standing Module cares
# afterwards, and the Victory Condition does its own checking at the end.
#
# Four rather than the twelve this was charted as, and the measurement is why. The Archive is ordered
# on turn 1, at a station with nobody on it, in 80 of 80 games -- always Axiom over Earth, which is
# founded bare. A bare station has zero Module slots (one per Colonist) and the Archive is exempt from
# that cap, so on turn 1 the Archive is literally the only thing the Archivists can build there. The
# first four people arrive at a median turn 11, which is the Core Module's four; the Habitat that
# lifts the ceiling past four lands at a median turn 17 and NEVER AT ALL in 24 of 80 games. Under a
# twelve gate the Archive was orderable in 29 games of 80, at a median turn 17, and only 17 of those
# had the three turns the Module needs left. The Archivists direct exactly one off-Earth place in
# every game, so the gate could not be routed around. Four is reachable; twelve was near-total.
colonists_to_order = 4

# Ticket #80 (version 0.06.0): the Observatory, the one Module that makes Research, on a Colony, a
# Space Station or in Antarctica. It takes no Body yield and no output multiplier: `amount`
# Research a turn, plus `research_per_colonist` for every Colonist at its Colony (one per cent,
# uncapped), times the Faction's Research multiplier and Public Science, rounded down, as a
# Research Lab is.
[[module]]
id = "observatory"
name = "Observatory"
materials = 28
widgets = 8
energy_upkeep = 3
produces = { resource = "research", amount = 2 }

[observatory]
research_per_colonist = 0.01

# Ticket #89 (version 0.06.0): the Solar Array, a Module only a Space Station holds
# (`station_only`). It makes `amount` Energy at Earth's distance from the Sun, scaled by the
# inverse square of its Body's mean distance (`sun_scaled`: Earth and the Moon x1, Mars and its
# moons x0.43, Venus x1.91), rounded to the nearest whole; no Body yield; Efficient Grids lifts it
# and a Solar Storm turn silences it. Any number may stand on one station.
[[module]]
id = "solar_array"
name = "Solar Array"
materials = 25
widgets = 8
energy_upkeep = 0
produces = { resource = "energy", amount = 6 }
station_only = true
sun_scaled = true

# Ticket #92 (version 0.06.0): the Mass Driver, a Module only a ground Colony on a low-gravity
# Body (bodies.toml `low_gravity`: the Moon, Phobos, Deimos) holds, one per Colony, behind
# `needs_tech`. While it is working, every transit the owner's Ships fly from that Body spends
# `[mass_driver] fuel_off` less, after the Faction's and the Tech's multipliers, never below
# `fuel_min`; and each Mine at its Colony makes `mine_bonus` more Materials, after everything.
[[module]]
id = "mass_driver"
name = "Mass Driver"
materials = 35
widgets = 8
energy_upkeep = 4
needs_tech = "efficient_transit"
low_gravity_only = true

# Ticket #164 (version 0.07.5): the Core Module. Every Colony and every Space Station is founded
# with one; it is never ordered, never mothballed, never decommissioned, and does not count against
# the Module cap. It holds `holds_colonists` people flat -- Expanded Habitats and the Arkwrights'
# capacity multiplier reach a Habitat and not this -- so a place can take its first arrivals before
# it has built anything, and `materials` and `widgets` are zero because nobody buys it.
# Ticket #332 (version 0.09.0): and it makes ONE Widget a turn, the base every Colony and station
# builds on with no Factory Module; `widgets` is nought as `materials` is, since nobody orders it.
[[module]]
id = "core"
name = "Core Module"
materials = 0
widgets = 0
energy_upkeep = 1
produces = { resource = "widgets", amount = 4 }
does = "holds 4 Colonists and never counts against the Colony's room for Modules"
holds_colonists = 4

# Ticket #185 (version 0.08.0): the Institute, the School's form off Earth. At most one per Colony
# or Space Station. While it stands and is online it raises its place's Education Level by the
# School's own step a turn, to the same ceiling (`[school]` in facilities.toml), and the figure
# decays back at that rate to the settlers' own average when it stops. Priced as the School is.
[[module]]
id = "institute"
name = "Institute"
materials = 25
widgets = 8
energy_upkeep = 2
does = "raises this place's Education Level 0.20 a turn, to 2.0; it falls back at the same rate when the Institute stops"

# Ticket #186 (version 0.08.0): the Academy, the Custodians' Unique Module, replacing the Institute
# on their build list at the common price. It does everything an Institute does and pays
# `academy_ducats` (facilities.toml) a turn while it is online. It wears the same name as their
# Unique Facility on Earth, at the designer's word. Appended last: `Tables::module` indexes
# ModuleKind by discriminant.
[[module]]
id = "academy"
name = "Academy"
materials = 25
widgets = 8
energy_upkeep = 2
does = "does an Institute's work and pays 1 Ducat a turn while it is online"

# Ticket #239 (version 0.08.3): the Heliostat, the Archivists' Unique Module, replacing the Solar
# Array on their build list at the common price -- the same 25 Materials, two turns, no upkeep,
# station-only and sun-scaled. It makes `heliostat_energy` (facilities.toml) more, added AFTER the
# inverse square scaling so the extra point is worth the same at every distance. Appended:
# `Tables::module` indexes ModuleKind by discriminant.
[[module]]
id = "heliostat"
name = "Heliostat"
materials = 25
widgets = 8
energy_upkeep = 0
produces = { resource = "energy", amount = 6 }
station_only = true
sun_scaled = true

# Ticket #239 (version 0.08.3): the Exchange, the Prospectors' Unique Module, replacing the Trade
# Post at the common price with every figure of its row, and paying `exchange_ducats`
# (facilities.toml) more a turn -- flat, and AFTER the output multiplier, exactly as the Academy's
# Ducat is, so a captured Exchange pays its captor what it paid its builder.
[[module]]
id = "exchange"
name = "Exchange"
materials = 25
widgets = 4
energy_upkeep = 2
does = "pays 1 Ducat more a turn than a Trade Post"
produces = { resource = "ducats", amount = 2 }
per_other_body = 3
fuel_off = 4
fuel_min = 1
mine_bonus = 1

# Ticket #239 (version 0.08.3): the Chorus, the Arkwrights' Unique Module, replacing the Relay at
# the common price with every figure of its row -- the same Allotment, the same Standing, and
# Relay Networks reaches it as it reaches a Relay. Its clause is `chorus_colonists`
# (facilities.toml): one more Influence into the Allotment for every that many Colonists at its
# OWN Colony, rounded down.
[[module]]
id = "chorus"
name = "Chorus"
materials = 25
widgets = 4
energy_upkeep = 2
influence_allotment = 1
standing_per_turn = 2

# Ticket #324 (version 0.08.8): the Battery, the one Module that fights. On a Colony or a station.
# It is a party in the orbital Battle at its Body whenever one is fought there, on Hold, at these
# figures; it never disengages and Hardened Hulls does not reach it. While one stands and works, no
# rival holds Orbital Control at its Body -- no landing, no Blockade against its owner -- and the
# owner gains no Control by it. Damage is repaired with Materials as a Ship's is, at the Colony
# itself; destroyed, it is gone. Appended last, as the Core Module was.
[[module]]
id = "battery"
name = "Battery"
materials = 25
widgets = 4
energy_upkeep = 3
strength = 4
hit_points = 6
does = "fires at rival Ship stacks in orbit here; while it stands no rival holds Orbital Control"

# Ticket #332 (version 0.09.0): the Factory Module, the one Module that makes Widgets off Earth:
# `amount` a turn, FLAT -- no Body yield, no slot yield, no Tech -- so a Colony's queue moves at
# more than its Core Module's one. The Faction's output multiplier applies as it does to the Earth
# Factory; Production Moved doubles it while a Factory of the Custodians' stands mothballed on
# Earth. On Earth (Antarctica) it emits as the Facility does. Appended last, as the Battery was.
[[module]]
id = "factory"
name = "Factory"
materials = 20
widgets = 4
energy_upkeep = 3
produces = { resource = "widgets", amount = 4 }
earth_emissions = 1.0

# Ticket #88 (version 0.06.0): build it where you dig. A Module (the Archive included) built at a
# Colony with one working Mine costs `one_mine` of its price, with two or more `two_mines`,
# multiplicative with the Faction's own discount, rounded down, never below `floor` of the row.
# A mothballed or unfinished Mine counts for nothing; Antarctica counts; Ships and stations do not
# take it.
[in_situ]
one_mine = 0.75
two_mines = 0.6
floor = 0.5
