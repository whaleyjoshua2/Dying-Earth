# Spec section 12.3. One tree shared by every Faction. Costs by rung: 15, 25, 40 (Coastal
# Engineering, 10 on rung 1 since ticket #69, is the one exception).
# The engine reads each effect by the tech id; the numbers here are the values the rules use.

[[tech]]
id = "efficient_grids"
name = "Efficient Grids"
branch = "Industry"
rung = 1
cost = 15
needs = []
effect = "Power Plant and Generator output x1.5"
value = 1.5

[[tech]]
id = "clean_power"
name = "Clean Power"
branch = "Industry"
rung = 2
cost = 25
needs = ["efficient_grids"]
effect = "Power Plant Emissions x0.4"
value = 0.4

[[tech]]
id = "clean_manufacturing"
name = "Clean Manufacturing"
branch = "Industry"
rung = 3
cost = 40
needs = ["clean_power"]
effect = "Factory and Refinery Emissions x0.4; Wildfire adds no Emissions"
value = 0.4

[[tech]]
id = "clean_propellant"
name = "Clean Propellant"
branch = "Propulsion"
rung = 1
cost = 15
needs = []
effect = "Launch Emissions 0.8; a Launch Pad Fire closes no Launch Site"
value = 0.8

[[tech]]
id = "efficient_transit"
name = "Efficient Transit"
branch = "Propulsion"
rung = 2
cost = 25
needs = ["clean_propellant"]
effect = "Transit Fuel x0.6; transits advance through Solar Storm"
value = 0.6

[[tech]]
id = "hardened_hulls"
name = "Hardened Hulls"
branch = "Propulsion"
rung = 3
cost = 40
needs = ["efficient_transit"]
effect = "Every Ship +2 strength; immune to Radiation Surge"
value = 2.0

[[tech]]
id = "expanded_habitats"
name = "Expanded Habitats"
branch = "Off-world Living"
rung = 1
cost = 15
needs = []
effect = "Each Habitat holds +2 Colonists"
value = 2.0

[[tech]]
id = "closed_loop_colonies"
name = "Closed-Loop Colonies"
branch = "Off-world Living"
rung = 2
cost = 25
needs = ["expanded_habitats", "clean_power"]
effect = "Module Energy upkeep x0.5; immune to Grid Failure"
value = 0.5

[[tech]]
id = "deep_mining"
name = "Deep Mining"
branch = "Extraction"
rung = 1
cost = 15
needs = []
effect = "Mine and Factory output x1.5; Rich Seam gives x3"
value = 1.5

[[tech]]
id = "automated_refining"
name = "Automated Refining"
branch = "Extraction"
rung = 2
cost = 25
needs = ["deep_mining", "efficient_grids"]
effect = "Refinery output x1.5; Ice Deposit gives x3"
value = 1.5

[[tech]]
id = "public_science"
name = "Public Science"
branch = "Society"
rung = 1
cost = 15
needs = []
effect = "Research Lab output x1.5; Breakthrough gives 25; stances hold through Comms Blackout; a Labour Dispute idles one Facility only"
value = 1.5

[[tech]]
id = "green_consensus"
name = "Green Consensus"
branch = "Society"
rung = 2
cost = 25
needs = ["public_science", "clean_power"]
effect = "Per-person Emissions x0.5; Influence thresholds x0.75; Heatwave loss halved"
value = 0.5
influence_threshold_multiplier = 0.75

# Ticket #56 (version 0.05): the thirteenth Tech. It unlocks the Sea Wall and nothing else, so
# `value` carries no figure any rule reads. Ticket #69 (version 0.05.5): moved from Industry rung 2
# at 25 (never reached in any game, so no Sea Wall was ever built) to rung 1 at 10 with no
# prerequisite, beside Efficient Grids; Clean Power still needs Efficient Grids alone.
[[tech]]
id = "coastal_engineering"
name = "Coastal Engineering"
branch = "Industry"
rung = 1
cost = 10
needs = []
effect = "Unlocks the Sea Wall."
value = 1.0
