# Spec section 14. Multipliers, signature rules and the starting position.

[[faction]]
id = "custodians"
name = "Custodians"
# Version 0.04 (ticket #46): the bare station over Earth the Faction starts with (named in bodies.toml).
start_station = "ISS"
blurb = "Colonize the solar system while limiting ecological damage to Earth."
output_multiplier = 1.0
emissions_multiplier = 0.75
research_multiplier = 1.25
influence_multiplier = 1.3
signature = "Restoration: in Orders, spend Energy in multiples of 10; each 10 adds 3.0 ppm to the Natural Sink in the next Climate phase only."
victory = "Stabilization (3 consecutive Climate phases with net Emissions below the Natural Sink) plus 12 Colonists living off Earth."
victory_first = { kind = "stabilization_run", bar = 3 }
colour = [0.15, 0.65, 0.6]

[[faction]]
id = "prospectors"
name = "Prospectors"
start_station = "Tiangong"
blurb = "Maximize extraction regardless of ecological cost."
output_multiplier = 1.25
emissions_multiplier = 1.25
research_multiplier = 0.75
influence_multiplier = 1.0
signature = "Cheap Industry: raising Industry Level costs 15 Materials instead of 30."
victory = "An Extraction Total of 500 Materials plus Fuel produced by Mines, Refineries and Factories, plus 12 Colonists living off Earth."
victory_first = { kind = "extraction_total", bar = 500 }
colour = [0.85, 0.5, 0.2]

# Ticket #50: two more Factions, so every game seats four. Their cards are provisional.
[[faction]]
# provisional, decided on ticket #51
id = "arkwrights"
name = "Arkwrights"
# The Arkwrights start with no station over Earth (ticket #50): they leave from the ground.
blurb = "Leave Earth: the diaspora is the point."
output_multiplier = 1.0
emissions_multiplier = 1.0
research_multiplier = 1.0
influence_multiplier = 1.0
signature = "(decided on ticket #51)"
victory = "24 Colonists living off Earth (which carries the 12 of Off-world Presence with it)."
victory_first = { kind = "colonists_off_earth", bar = 24 }
colour = [0.55, 0.35, 0.80]

[[faction]]
# provisional, decided on ticket #51
id = "archivists"
name = "Archivists"
start_station = "Axiom"
blurb = "Build the Archive and upload everyone."
output_multiplier = 1.0
emissions_multiplier = 1.0
research_multiplier = 1.25
influence_multiplier = 1.0
signature = "(decided on ticket #51)"
victory = "150 Research produced by their own Labs, plus 12 Colonists living off Earth."
victory_first = { kind = "research_produced", bar = 150 }
colour = [0.75, 0.82, 0.92]

[restoration]
energy_per_step = 10
sink_per_step = 3.0

[start]
# Raised from 60 on ticket #24, since income now flows from turn one.
materials = 80
fuel = 20
energy = 20
research = 0
ducats = 0

# Ticket #35 (version 0.03): Ducats. A controlled Nation State makes gdp x Industry Level / 10 a turn
# (gdp on its card); a Bank adds bank_per_gdp_tenth x gdp / 10; a Trade Post makes trade_post_base x
# the Body's Habitat yield. Ducats buy Influence, Restoration steps and repair points at these rates.
[ducats]
per_influence = 2
# Version 0.04 (ticket #41): two Ducats for one of the thing bought, as with Influence. A
# Restoration step is 10 Energy, a repair point 5 Materials.
per_restoration_step = 20
per_repair_point = 10
# Version 0.04 (ticket #42): the trading window. Ducats per unit bought; a sale returns the buying
# price divided by sell_divisor (rounded down over the lot); a building bought for Ducats costs its
# Materials times per_building_material.
per_materials = 2
per_fuel = 3
per_energy = 1
sell_divisor = 2
per_building_material = 2
bank_per_gdp_tenth = 4.0
trade_post_base = 3.0
