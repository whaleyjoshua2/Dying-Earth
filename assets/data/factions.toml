# Spec section 14. Multipliers, signature rules and the starting position.

[[faction]]
id = "custodians"
# Ticket #100 (version 0.07.0), renamed on ticket #195 (version 0.08.0): the Region the start
# screen opens the globe on for this Faction. It changes nothing else -- no starting position, and
# any of the fourteen may still be chosen -- which is what the old name `home` did not say.
# Energy-lean for the Scrubbers, education 1.45 for the Research their Stabilization run leans on.
opens_on = "europe"
name = "Custodians"
# Ticket #221 (version 0.08.2): they exist to object to what the Prospectors do, and mind another
# Faction's Blame at twice the ordinary rate.
resentment = 2.0
# Version 0.04 (ticket #46): the bare station over Earth the Faction starts with (named in bodies.toml).
start_station = "ISS"
# Ticket #290 (version 0.08.6): the Colonists aboard it when the game opens, from nowhere, so the
# station has two Module slots free from turn one; bare, it had none.
start_colonists = 2
# Ticket #210 (version 0.08.1): the prefix every Ship of theirs wears in front of its name --
# Terran Stewardship Vessel. Chosen at the designer's word, "dealers choice". It belongs to the
# HOLDER, not the hull: the name is the ship's and travels with it, the prefix is whoever flies it.
ship_prefix = "TSV"
blurb = "Colonize the solar system while limiting ecological damage to Earth."
# Ticket #260 (version 0.08.4): the motto, one line under the name on the card, the Faction speaking.
motto = "Leave it better than we found it."
output_multiplier = 1.0
emissions_multiplier = 0.75
research_multiplier = 1.25
# Ticket #54 (version 0.05): 1.3 down to 1.25, with the Scrubber and Leapfrog in the same hand.
# Ticket #82 (version 0.06.0): 1.25 down to 1.2, with the mothball pairs in the same hand.
influence_multiplier = 1.2
# Ticket #82: Production Moved. While a Facility of one of these kinds in a state they direct is
# mothballed, one Module of the paired kind off Earth (a station over Earth included, Antarctica
# not) makes double: one for one, the most productive undoubled Module first, on its final figure.
# Ticket #332 (version 0.09.0): the Factory pairs with the Factory Module and the Mine with the
# Mine, now that each list has both; before, the Factory paired with the Mine.
mothball_pairs = { factory = "factory", mine = "mine", power_plant = "generator", refinery = "refinery", research_lab = "observatory" }
signature = "The Scrubber, Leapfrog and Production Moved. Only they build a Scrubber, in a Region they control, and it takes no build slot: 30 Materials, 2 turns, 4 Energy upkeep, no Emissions. Online it adds 3.0 ppm a turn to the Natural Sink and takes 1 off that Region's Unrest. A Region holds one per two hundred million people, between 2 and 10, and they are destroyed if it changes hands. A Leapfrog costs 50 Ducats in a Region they control and lowers its people's Emissions coefficient by 0.03 for good, never below 0.04. Production Moved: while a Factory, Mine, Power Plant, Refinery or Research Lab of theirs stands mothballed, one Factory, Mine, Generator, Refinery or Observatory of theirs off Earth makes double, one for one, the most productive first."
# Ticket #203 (version 0.08.1): the Unique Facility in one sentence, for the Faction card and the
# Faction window. Ticket #186 built the Academy; nothing on any card named it until now.
unique = "Academy -- replaces the School and the Institute, and pays +1 Ducat a turn while it is online."
victory = "Stabilization (3 consecutive Climate phases with net Emissions below the Natural Sink) plus 12 Colonists living off Earth."
# Ticket #350 (version 0.09.1): the Condition in one clause for the turn-1 Report line, in the
# designer's approved words. {first}, {second} and {bodies} are filled from the bars below, so a
# moved bar moves the line; the old line told every Faction "get twelve Colonists off Earth".
victory_short = "reach Stabilization, {first} Climate phases running with Emissions under the Natural Sink, with {second} Colonists living off Earth,"
victory_first = { kind = "stabilization_run", bar = 3 }
victory_second = { kind = "off_world_presence", bar = 12 }
colour = [0.15, 0.65, 0.6]

[[faction]]
id = "prospectors"
# Ticket #100 (version 0.07.0), renamed on ticket #195 (version 0.08.0): the Region the start
# screen opens the globe on for this Faction. It changes nothing else -- no starting position, and
# any of the fourteen may still be chosen -- which is what the old name `home` did not say.
# Materials-lean at Industry 3 and GDP 23: the extraction engine their whole game is.
opens_on = "east_asia"
name = "Prospectors"
start_station = "Tiangong"
# Ticket #290 (version 0.08.6): the Colonists aboard it when the game opens, from nowhere, so the
# station has two Module slots free from turn one; bare, it had none.
start_colonists = 2
# Ticket #210 (version 0.08.1): the prefix every Ship of theirs wears in front of its name --
# Prospector Mining Venture. Chosen at the designer's word, "dealers choice". It belongs to the
# HOLDER, not the hull: the name is the ship's and travels with it, the prefix is whoever flies it.
ship_prefix = "PMV"
blurb = "Maximize extraction regardless of ecological cost."
motto = "Everything has a price. We find it."
output_multiplier = 1.25
emissions_multiplier = 1.25
research_multiplier = 0.75
influence_multiplier = 1.0
# Ticket #72 (version 0.05.5): Facilities and Colony Modules cost the Prospectors 15% less, rounded
# down (a 20-Materials Factory is 17, a 25-Materials Habitat 21); Stations, Ships and Industry
# Level are not discounted.
facility_materials_multiplier = 0.85
module_materials_multiplier = 0.85
# Ticket #83 (version 0.06.0): a Nation State they control pays its GDP income x1.2 (Banks and
# Trade Posts keep the general x1.25), and the Trading window charges them 15% less for a lot of
# Materials, Fuel or Energy or a building bought outright; Influence and selling are untouched.
ducats_multiplier = 1.2
market_multiplier = 0.85
# Ticket #221: zero. They do not mind another Faction's Blame at all, which is a statement about them.
resentment = 0.0
signature = "Cheap Industry and the Strip Permit. Raising Industry Level costs them 15 Materials rather than 30, every Facility and Module 15% less; their Regions pay a fifth more Ducats and the Trading window sells to them at 15% off. A Strip Permit is free and may be taken once in a Region's whole life: for three turns every Facility there produces double, and when it ends that Region's Baseline Emissions rise by 0.2 for good and its Unrest by 3. The Venture Capital Fund: each turn they set what share of their Ducat income is banked in it, 0% to 80% in whole percents; a withdrawal returns nine tenths."
# Ticket #203 (version 0.08.1). The building is ticket #182's.
unique = "Investment Bank -- replaces the Bank, and banks 1% interest a turn on the Venture Capital Fund's balance, one building per Region paying, never less than 1 Material in all. Off Earth, the Exchange -- replaces the Trade Post, and pays 1 more Ducat a turn."
# Ticket #72: the Extraction Total is retired; the first part is Materials banked in the Fund.
victory = "2500 Ducats in the Venture Capital Fund, plus 12 Colonists living off Earth."
victory_short = "put {first} Ducats in the Venture Capital Fund with {second} Colonists living off Earth,"
# Ticket #182 (version 0.08.0): 750 to 1000, because the Investment Bank pays uncapped interest
# on the Fund. Measured first: in 40 games nobody EVER reached 750 -- the highest balance ever
# seen was 745, the median game ended around turn 28 with the Fund in the 400s, and the
# Prospectors won 0 of 80. The bar rises to keep the Fund a race rather than a formality now
# that a Bank in each of ten Regions pays around 44 Materials a turn by turn 24.
# Ticket #256 (version 0.08.4): 2000 to 2500 at the designer's word, a deliberate stretch. Measured
# first: at 2000 the median computer seat ended just across the line (2049 and 2145 in the two
# seatings read) and the Prospectors won 30 of 80, the most of any seat. At 2500 the median game
# ends short; "other things will bolster their output". The AI reads this figure, not a copy of it.
victory_first = { kind = "venture_fund", bar = 2500 }
victory_second = { kind = "off_world_presence", bar = 12 }
colour = [0.85, 0.5, 0.2]

# Ticket #50 seated two more Factions; ticket #51 gave them their cards.

[[faction]]
id = "arkwrights"
# Ticket #100 (version 0.07.0), renamed on ticket #195 (version 0.08.0): the Region the start
# screen opens the globe on for this Faction. It changes nothing else -- no starting position, and
# any of the fourteen may still be chosen -- which is what the old name `home` did not say.
# Population 1940, the largest on Earth -- 388 in the units of five million used from ticket #143
# (version 0.07.3) until ticket #333 (version 0.09.0) put population in units of one million people,
# and 19.4 in the hundreds of millions before that -- and Coach Class recruits eight a turn at
# twice the population cost.
opens_on = "south_asia"
name = "Arkwrights"
# Ticket #221: half. Leaving is the point; the smoke behind them is somebody else's argument.
resentment = 0.5
# The Arkwrights start with no station over Earth (ticket #50): they leave from the ground.
# Ticket #290 (version 0.08.6): so two Pioneers wait in their start Region on turn one instead, a gift
# outside Coach Class that takes no population -- the mirror of the two Colonists aboard everybody
# else's station. They wait for the first Ship.
start_emigrants = 2
blurb = "Leave Earth: the diaspora is the point."
motto = "Nothing left behind but the Earth."
# Ticket #210 (version 0.08.1): the prefix every Ship of theirs wears in front of its name --
# the Ark itself, a word rather than an initialism, because it is theirs. Chosen at the designer's word, "dealers choice". It belongs to the
# HOLDER, not the hull: the name is the ship's and travels with it, the prefix is whoever flies it.
ship_prefix = "ARK"
output_multiplier = 1.0
emissions_multiplier = 1.0
research_multiplier = 1.0
influence_multiplier = 0.8
# Ticket #51: Habitats hold half again as many, and a transit burns three quarters of the Fuel
# (applied before Efficient Transit, multiplicative).
habitat_capacity_multiplier = 1.5
transit_fuel_multiplier = 0.75
# Ticket #51, Coach Class: double loads at double the population cost, and cheap Colony Ships.
colony_ship_capacity_multiplier = 2.0
lift_population_multiplier = 2.0
# Ticket #73 (version 0.05.5): Coach Class recruits eight Pioneers a turn where everyone else recruits
# four, at the doubled population above.
emigrants_multiplier = 2.0
# Ticket #83 (version 0.06.0): the 20-Materials Colony Ship is retired for the common 30, and
# every Ship costs them 15% less, rounded down: Colony Ship 25, Frigate 21, Carrier 25,
# Battleship 42.
ship_materials_multiplier = 0.85
# Ticket #51: they start with no station, so a Space Station costs them half and a Colony Module
# three quarters (both rounded down).
station_materials_multiplier = 0.5
module_materials_multiplier = 0.75
signature = "Coach Class. A Colony Ship carries 8 Colonists, 12 with Expanded Habitats, and their Habitats hold half again as many, 6 and 12. They recruit 8 Pioneers a turn where others recruit 4, but every Pioneer takes twice the population. Every Ship costs them 15% less, a Colony Ship 25 Materials; a transit burns three quarters of the Fuel; and, starting with no station, a Space Station costs them 20 Materials and a Module three quarters."
# Ticket #203 (version 0.08.1). The building is ticket #183's.
unique = "Spaceport -- replaces the Launch Site, and pays +1 Influence into next turn's Allotment for every Pioneer it lifts off Earth. Off Earth, the Chorus -- replaces the Relay, and adds +1 Influence to the Allotment for every 6 Colonists at its Colony."
victory = "Diaspora: 30 Colonists living off Earth, on Colonies spread over at least three Bodies with at least 4 Colonists each (Antarctica and stations over Earth do not count)."
victory_short = "get {first} Colonists living off Earth, spread over {bodies} Bodies,"
victory_first = { kind = "colonists_off_earth", bar = 30 }
victory_second = { kind = "colonies_on_bodies", bodies = 3, colonists_each = 4 }
colour = [0.44, 0.275, 0.66]

[[faction]]
id = "archivists"
# Ticket #100 (version 0.07.0), renamed on ticket #195 (version 0.08.0): the Region the start
# screen opens the globe on for this Faction. It changes nothing else -- no starting position, and
# any of the fourteen may still be chosen -- which is what the old name `home` did not say.
# Education 1.5, the highest there is, and GDP 23 to pay for the Archive.
opens_on = "north_america"
name = "Archivists"
# Ticket #221: the ordinary rate.
resentment = 1.0
start_station = "Axiom"
# Ticket #290 (version 0.08.6): the Colonists aboard it when the game opens, from nowhere, so the
# station has two Module slots free from turn one; bare, it had none.
start_colonists = 2
# Ticket #210 (version 0.08.1): the prefix every Ship of theirs wears in front of its name --
# Archive Class Vessel. Chosen at the designer's word, "dealers choice". It belongs to the
# HOLDER, not the hull: the name is the ship's and travels with it, the prefix is whoever flies it.
ship_prefix = "ACV"
blurb = "Build the Archive and upload everyone."
motto = "Everyone remembered."
# Ticket #81 (version 0.06.0): the output nerf (0.8) is lifted whole, and Research is 1.5 on Earth
# (every Lab, and an Observatory in Antarctica) and 1.75 off it (an Observatory on any other Body
# or on a station, a station over Earth included), where 1.6 stood everywhere.
output_multiplier = 1.0
emissions_multiplier = 0.9
research_multiplier = 1.5
research_multiplier_off_earth = 1.75
influence_multiplier = 1.0
signature = "Provisional Findings. While their Research went to the shared Tech last turn, they already have half the effect of the Tech under research: a multiplier x reads 1 + (x - 1) / 2, an addition reads half rounded down, and immunities do not carry. A turn of funding the Archive switches it off for the turn after. Their Research is x1.5 on Earth and x1.75 off it, an Observatory on a station over Earth counting as off."
# Ticket #203 (version 0.08.1). The building is ticket #184's.
unique = "Reactor -- replaces the Power Plant, and takes 75% off the Energy upkeep of everything its holder owns, the Archive excepted. Off Earth, the Heliostat -- replaces the Solar Array, and makes 1 more Energy wherever it stands."
# Ticket #68 (version 0.05.5): the first part is the Research paid into the Archive.
# Ticket #347 (version 0.09.1): 125 of it, and the fund holds the whole figure from the first turn.
# This bar IS `[archive] research` in modules.toml -- one figure written in two files, the Archive's
# cost and the Archivists' bar, and a test asserts the two are equal so they cannot drift.
victory = "Build the Archive at a Colony off Earth (50 Materials, three turns, and four Colonists must live there to begin it), pay 125 Research into it and keep it running, then upload 12 Colonists into it from the people living where it stands."
victory_short = "build the Archive off Earth, pay {first} Research into it, and upload {second} Colonists,"
victory_first = { kind = "archive_research", bar = 125 }
# Ticket #192 (version 0.08.0): twelve Colonists UPLOADED, not twelve living beside the Archive.
victory_second = { kind = "colonists_uploaded", bar = 12 }
colour = [0.871, 0.322, 0.439]

# Ticket #54 (version 0.05): the [restoration] table is retired with the order; the Custodians'
# signature rule is the Scrubber (facilities.toml) and Leapfrog (per_leapfrog below).

# Ticket #72 (version 0.05.5): the Prospectors' Venture Capital Fund. The largest share that may be
# banked a turn, the step the share moves in, and what a draw gives back.
# Ticket #240 (version 0.08.3): the share is of DUCAT INCOME, not Materials output, and the Fund
# holds Ducats. max_share is left at 0.8 at the designer's word -- "keep 80" -- with the note that
# the top of the slider is now a real trade-off rather than nearly free: measured over 120 games
# every seat ends every game holding about five Ducats, so banking four fifths of income starves
# Influence, Relief and repairs. The computer weighs it by taking the SMALLEST share that still
# reaches the bar by its pace's last turn, so it banks the least it can.
# Ticket #191 (version 0.08.0): Relations. One score per ORDERED PAIR, so twelve in a four-seat
# game: the Arkwrights' view of the Prospectors is a different number from the Prospectors' view of
# the Arkwrights. Measured over 80 games, of the 317 pairs where anything happened 49% were purely
# one-directional and 80% of offending pair-turns had only one direction firing, so a shared number
# would have thrown all of that away.
#
# The score does NOTHING mechanical in this version -- it is read, not spent, and the computer
# players do not read it. Giving the computer a grudge would re-open the denial multiplier ticket
# #50 deliberately removed, and would move every figure in the sweep at the same moment six other
# rules are moving them.
[relations]
# The scale. The +10 half is RESERVED and nothing fills it in this version; it exists so the scale
# reads naturally and 0 is genuinely neutral. An all-zero-or-negative grid is the rule working.
# Ticket #236 (version 0.08.3): the shared pot. A Faction that keeps too much of its Research is
# resented for it, and one that gives all of it is thought the better of.
#
# It is a TERM, not a deed -- recomputed every settle from what the Faction is doing NOW, exactly
# as the Blame term is, and gone the moment they contribute again. The designer's words were "plus/
# minus 1 but only for that turn", and the measurement is why that shape matters: with the Research
# Directive shipped, the computer seats set their directive on turn 2 and never move it, so a
# PERMANENT deed of -1 against every rival every turn would be about 78 points of damage a seat
# over a game, on a scale that bottoms at -10. As a term it is at most -1 at any moment.
#
# 85 is the designer's figure. It is only a meaningful line because the same ticket taught the AI
# to weigh the Tech under research: before that every seat sat at its cap from turn 2 and was
# permanently below any threshold worth having.
directive_min_contribution = 85
directive_step = 1
# The reward may not lift a pair past the TOP OF CORDIAL, the step above Neutral, at the designer's
# word. Version 0.08.2 settled deliberately that a pair which never strikes an Accord can never
# rise above Neutral; this bends that by exactly one band rather than breaking it, so generosity
# stops a rival resenting you and still does not make them a friend.
directive_boost_ceiling = 6

best = 10
worst = -10
start = 0
# What one OFFENDING TURN costs: a turn in which the offender spent any Influence on a place the
# victim holds, or opened a Battle against them. Charged per TURN and never per spend order -- a pair
# that offends puts in a median 15.6 Influence across about three orders, and charging per order
# would make a big push and a small one differ by a factor nobody can read off the board.
fall_per_offending_turn = 1
# Ticket #299 (version 0.08.6): the rung an Occupation broken sits on -- between a bid, a Smear, an
# Agitate or a Blockade turn at 1 and a Battle opened or an Accord broken at 3 -- charged to the
# occupier by the previous holder the turn its last Army leaves the place. The first weight-2
# offence in the game.
occupation_broken_offence = 2
# Recovery: this much every `quiet_turns` quiet turns, stopping at `start` and never rising past it.
# Letting peace accrue goodwill was measured and rejected: half of all ordered pairs never interact
# at all in a whole game, so goodwill earned by mere quiet would mostly be between Factions on
# opposite sides of the board who have never met -- that is distance, not friendship. There is an
# arithmetic trap too: a pair offends on 12.55% of its turns, so at -1 an offence and +0.25 a quiet
# turn the two cancel, and a median offender would end at about +0.5. For an offender to stay
# negative the cost must be roughly seven times the per-turn recovery; stopping at 0 removes it.
recover = 1
quiet_turns = 4

# Ticket #222 (version 0.08.2): a turn charges the SUM of every instance -- a place spent on, an act
# committed, never an ORDER -- capped here. This knowingly reverses the flat one-per-turn charge
# above: charging per PLACE keeps that rule's objection (splitting one spend across three orders
# cannot multiply the damage) while giving proportionality (pushing on three of their places costs
# three times pushing on one). Measured, the cap bites on 1.7% of offending pair-turns.
turn_cap = 8
# Ticket #221: the share of the four Factions' Blame, above a fair quarter, that buys one step of
# resentment -- nothing below 0.35, one step at 0.35, two at 0.45. Times the RESENTING Faction's own
# `resentment` coefficient. Capped at half the scale, so Blame alone can make a pair Cold and never
# Hostile. Measured over 200 games: the Prospectors are above 0.35 from turn 1 and reach about 0.53;
# the Custodians never crossed it once in 200 games, so nobody ever resents them.
blame_step = 0.10
blame_cap = 5
# Ticket #223: the +10 half, filled only by ACTS and never by time. The two acts are a tribute paid
# and an Accord kept, both defined by the Accords; a pair that never strikes one can never rise above
# neutral, which is correct, since 41-45% of ordered pairs never interact at all in a whole game.
# `deeds_ceiling` is how far the DEEDS figure may climb past the scale: only the SHOWN score clamps,
# so a pair carrying a -5 Blame term can still reach Friendly at +7 on deeds of +12.
act_gain = 1
deeds_ceiling = 15
positive_quiet_turns = 8
# Ticket #225: the floor ratchets one step every `scar_turns` OFFENDING TURNS -- turns, not points,
# so retuning the ladder later does not silently move every scar. Measured: a pair that ever offends
# has a median 10 offending turns, so at 4 the median pair reaches -2, one step short of the limit,
# and only a hot pair is floored. -3 rather than -5 deliberately: every act that raises Relations is
# an Accord act, so a pair floored below the level an Accord can be struck at would have no road back.
scar_turns = 4
scar_floor = -3
# Ticket #226 (version 0.08.2): a tribute is a FIXED gift, not an amount the giver picks -- the
# Relations gain is the flat `act_gain`, so a free amount would let one Ducat buy what fifty buys.
# An Accord kept pays every `accord_kept_turns` turns, repeatably, and is the only thing in the game
# that lifts a scarred pair's floor.
tribute_ducats = 25
tribute_materials = 15
accord_kept_turns = 4

# Ticket #268 (version 0.08.4): carbon credits. The Custodians -- and only they -- may offer ppm of
# carbon credit a turn, standing until changed; any other Faction may buy up to `cap_per_turn` ppm
# of it at `price_per_ppm` Ducats each, times the Custodians' view of the buyer (Hostile refuses).
# A credit bought comes OFF the buyer's Blame ledger for good. On the seller's side it comes off
# their Blame credit -- what their Scrubbers and Directive removed -- and, at the designer's word,
# they may sell MORE than they hold: the excess goes onto their own ledger as Blame taken. "Any
# amount and take the blame": forcing them to sell only what they hold would deprive them of any
# reason to get credit, and forbidding overselling would gimp a strategic choice. A purchase is an
# act of friendship both ways. The Ducats land in the Custodians' Stockpile.
[carbon_credits]
price_per_ppm = 1
cap_per_turn = 10
friendly = 0.5
cordial = 0.75
neutral = 1.0
wary = 1.5
cold = 2.0
ai_oversell_when_ducats_below = 20

[venture_capital]
max_share = 0.8
# Ticket #256 (version 0.08.4): a tenth to a hundredth. The share is a slider now, mirroring the
# Research Directive's, and "the entire point of the slider is to allow finer control".
share_step = 0.01
draw_return = 0.9

# Ticket #73 (version 0.05.5): Pioneers. Colonists are built: a Faction recruits up to `per_turn` a
# turn in one Nation State it directs, at `population_each` population apiece (times the Faction's
# lift multiplier: Coach Class doubles it), landing on the state's card at End Turn; a batch takes
# `unrest_fall` off the state's Unrest. Pioneers sent to Antarctica by sea arrive `antarctica_turns`
# later, with no launch.
# Ticket #237 (version 0.08.3): the Exodus Call. The Arkwrights only, on a state they control, once
# per state EVER -- the shape the Strip Permit has had since ticket #54. While it runs it doubles
# what they may recruit there AND suspends Coach Class's double population charge.
#
# That second clause is the ticket. Measured first: their home state runs from 20 units to 1 over a
# game already, because Coach Class charges twice a head, and an order that doubled only the count
# would have burned the country twice as fast -- deepening the very thing that leaves them winning
# 3 games of 80. The designer chose the reading that moves people without eating the source faster
# than any other Faction does.
# Ticket #238 (version 0.08.3): a Faction must have held a Region for this many whole turns before
# it may remake it -- the Strip Permit, the Leapfrog and the Exodus Call. The turn of the taking
# does not count, so a Region taken on turn 10 opens on turn 13, and a starting Region on turn 4.
#
# Measured before it was taken, over five whole games: it would have refused 31 of 31 Strip Permits
# and 2 of 36 Leapfrogs as those orders were ACTUALLY issued. Every Strip Permit goes on a Region
# held nought or one turns, while the Prospectors hold NINE Regions of nine for three turns or more
# by mid-game. They are not losing their grip; the AI simply strips each new Region the turn it
# arrives, a fresh one being the obvious unstripped candidate, so the rule pushes strips onto the
# pile of long-held Regions the seat is already sitting on.
#
# That projection UNDERSTATED the cost, and the A/B says so. Flipping this value between 0 and 3
# over the same twenty seeds, six parameter rows, Leapfrogs issued over the batch fall 378 -> 177,
# a little under HALF. A refused order does not simply wait: the Ducats go elsewhere that turn and
# the board diverges. The share kept rises with the length of the game -- 20% on the shortest row,
# 51% on the longest -- which is the delay showing through where there are turns enough to spend it.
[faction_orders]
min_turns_held = 3

[exodus_call]
turns = 2
muster_multiplier = 2

[emigrants]
per_turn = 4
population_each = 1.0
unrest_fall = 0.5
antarctica_turns = 1

[start]
# Raised from 60 on ticket #24, since income now flows from turn one.
materials = 80
fuel = 20
energy = 20
research = 0
ducats = 0

# Ticket #35 (version 0.03): Ducats. A controlled Nation State makes gdp x Industry Level / 10 a turn
# (gdp on its card); a Bank adds bank_per_gdp_tenth x gdp / 10; a Trade Post makes trade_post_base x
# the Body's Habitat yield. Ducats buy Influence, Leapfrogs and repair points at these rates.
# Ticket #235 (version 0.08.3): the Research Directive. A Faction may send a share of its Research
# somewhere other than the shared Tech, chosen as a percentage and standing until changed. The
# Archivists had this since version 0.07.0 as a switch with two positions; it is a slider now, and
# theirs is the only one that runs to 100.
#
# The rates were fitted against a measurement rather than guessed. Research made over a whole
# 36-turn game, median by Faction over 20 seeds: Custodians 131, Prospectors 442, Arkwrights 149,
# Archivists 453 -- so half a turn's Research is about 1.8 points for the Custodians, 6.2 for the
# Prospectors and 2.1 for the Arkwrights, which is far less than the rule was first drafted against.
[research_directive]
# The most any Faction but the Archivists may divert. Theirs is `archivists_max`.
max = 50
archivists_max = 100
# Provisional Findings holds while at least this share still goes to the shared Tech. At the
# designer's word, "make it a threshold 75%" -- so a directive of 25 or less keeps the rule and
# anything above it trades the rule away. Before this the answer was binary, because the control
# was: any funding at all turned Provisional Findings off.
provisional_min_contribution = 75
# The Custodians: ppm added to the Natural Sink per point diverted, FOR GOOD. Permanent at the
# designer's word, and cut from the 0.05 first proposed to 0.01 when the measurement showed what
# their Research really is: at 0.05 permanent it was +2.7 ppm over a game, a 45% enlargement of a
# 6.0 Sink, on the Faction that already wins 37 of 80 on exactly this condition. At 0.01 it is
# about +0.5 ppm over a game if they divert half throughout -- half a Planetary Stewardship, earned
# over thirty turns of not researching. Per-turn instead of permanent was measured at 0.09 ppm a
# turn, which is one and a half per cent of the Sink: invisible, and the reason permanent won.
custodians_ppm_per_point = 0.01
# The Prospectors: Ducats per point. "10-1" was ambiguous by a factor of a hundred -- ten points to
# a Ducat is 22 Ducats over a game, less than half a Leapfrog, and one point to ten Ducats is 2,200,
# larger than their whole economy. The designer chose 0.8, about 5 Ducats a turn and 178 over a
# game: real money, roughly three Leapfrogs, without dwarfing the Regions.
prospectors_ducats_per_point = 0.8
# The Arkwrights: Fuel per point, the designer's "+1 fuel every 5 research" unchanged. About 0.4 a
# turn and 15 over a game -- two or three extra Moon transits, pointed at the thing they actually
# lack, which is the range to move people.
arkwrights_fuel_per_point = 0.2

[ducats]
per_influence = 2
# Version 0.04 (ticket #41): two Ducats for one of the thing bought, as with Influence. A repair
# point is 5 Materials, so 10 Ducats. Ticket #54 retired `per_restoration_step` with Restoration and
# put `per_leapfrog` in its place: what one Leapfrog costs the Custodians on a state they control.
per_leapfrog = 50
# Ticket #237 (version 0.08.3): what an Exodus Call costs the Arkwrights, matched to a Leapfrog --
# the other Faction-only order bought with Ducats on a state you control.
per_exodus_call = 50
per_repair_point = 10
# Version 0.04 (ticket #42): the trading window. Ducats per unit bought; a sale returns the buying
# price divided by sell_divisor (rounded down over the lot); a building bought for Ducats costs its
# Materials times per_building_material.
# Ticket #220 (version 0.08.2): each of the three rose by ONE and is now the MIDPOINT of a band
# `price_band` wide, not a constant. Energy at 1 had no downward step at all in whole Ducats, and
# raising only Energy would have been a balance change smuggled in as a display fix -- so all three
# rose together. This IS a substantive change and not a display one: Materials +50%, Fuel +33%,
# Energy +100%, on a currency that also buys Influence, Relief, Resettle and Leapfrogs, and the
# AI's fixed lot of ten Materials now costs 30 Ducats where it cost 20.
per_materials = 3
per_fuel = 4
per_energy = 2
price_band = 1
price_step_units = 20
sell_divisor = 2
per_building_material = 2
bank_per_gdp_tenth = 4.0
# Ticket #90 (version 0.06.0): `trade_post_base` is retired; the Trade Post's figures are on
# modules.toml (2 per Colonist at its Body, 3 per other Body held).
