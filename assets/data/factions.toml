# Spec section 14. Multipliers, signature rules and the starting position.

[[faction]]
id = "custodians"
name = "Custodians"
blurb = "Colonize the solar system while limiting ecological damage to Earth."
output_multiplier = 1.0
emissions_multiplier = 0.75
research_multiplier = 1.25
influence_multiplier = 1.3
signature = "Restoration: in Orders, spend Energy in multiples of 10; each 10 adds 3.0 ppm to the Natural Sink in the next Climate phase only."
victory = "Stabilization (3 consecutive Climate phases with net Emissions below the Natural Sink) plus 12 Colonists living off Earth."
colour = [0.15, 0.65, 0.6]

[[faction]]
id = "prospectors"
name = "Prospectors"
blurb = "Maximize extraction regardless of ecological cost."
output_multiplier = 1.25
emissions_multiplier = 1.25
research_multiplier = 0.75
influence_multiplier = 1.0
signature = "Cheap Industry: raising Industry Level costs 15 Materials instead of 30."
victory = "An Extraction Total of 500 Materials plus Fuel produced by Mines, Refineries and Factories, plus 12 Colonists living off Earth."
colour = [0.85, 0.5, 0.2]

[restoration]
energy_per_step = 10
sink_per_step = 3.0

[start]
# Raised from 60 on ticket #24, since income now flows from turn one.
materials = 80
fuel = 20
energy = 20
research = 0
ducats = 0

# Ticket #35 (version 0.03): Ducats. A controlled Nation State makes gdp x Industry Level / 10 a turn
# (gdp on its card); a Bank adds bank_per_gdp_tenth x gdp / 10; a Trade Post makes trade_post_base x
# the Body's Habitat yield. Ducats buy Influence, Restoration steps and repair points at these rates.
[ducats]
per_influence = 2
# Version 0.04 (ticket #41): two Ducats for one of the thing bought, as with Influence. A
# Restoration step is 10 Energy, a repair point 5 Materials.
per_restoration_step = 20
per_repair_point = 10
bank_per_gdp_tenth = 4.0
trade_post_base = 3.0
