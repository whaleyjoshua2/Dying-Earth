# Spec section 8.3 and 8.5.
allotment_base = 10
# allotment_per_state (3) was retired on ticket #34: each state carries its own influence figure in nation_states.toml.
state_threshold_base = 20
state_threshold_per_size = 10
# Ticket #336 (version 0.09.0): 10 to 20, at the designer's word -- "double influence needed to
# take a space station or colony". Beside it a base of its own under EVERY place off Earth, so a
# place nobody has moved into still costs something to take: a ground Colony with no Colonists was
# worth nothing at all and went for a single point of Standing. The station base below REPLACES
# this one on a station rather than sitting on top of it, so a station and a ground Colony of the
# same crew are worth the same figure; both bases stay separate figures so they can diverge again
# without a rule change. The challenge margin does NOT double: it is shared with Earth, so on a
# settled place the binding figure is still the holder's Standing plus 20.
colony_threshold_per_colonist = 20
colony_threshold_base = 40
decay = 2
# Ticket #33 (version 0.03): standings persist; a place you control decays slower. A challenger
# needs a standing above the controller's and at least the threshold.
decay_controlled = 1
# Version 0.04 (ticket #41): a challenger needs the controller's standing plus this margin, so a
# contested place changes hands after a push of a few turns rather than every turn. Ticket #75
# (version 0.05.5): 10 to 20, beside a start Standing on every Faction's home state equal to its
# threshold, after the Custodian AI took seat 0's start state on turn 7 in every seed.
challenge_margin = 20
# Ticket #349 (version 0.09.1): a place you hold is PRESSED while any rival's Standing there is
# within this of yours -- the designer's "within 10 your influence". It is measured against YOUR
# Standing, not the rival's price, so it comes early: they still need your Standing plus the margin
# above to take it, and a turn's Allotment can cover 10 at once. It moves no rule; it is what the
# Command Cluster lists and what turns a card's challenger line amber. It replaced the card's old
# reading of the computer's `influence_step` x 2, an AI tuning figure doing the interface's job.
pressed_band = 10
# Ticket #190 (version 0.08.0): what a Constabulary standing and online adds to the challenge margin
# in its Region, for EVERY challenger, whoever built it -- a police force serves the government of
# the day. Nothing on a neutral Region, which has no margin at all: the price there is the threshold.
# Measured over 800 games, this will almost never fire under the computer players: a Constabulary
# stands on 0.5% of Region-turns, only 29 of 9,463 Influence takes had one standing, and a margin of
# 25 would have blocked 7 of them -- about one take per 114 games. It is kept because it gives a
# PLAYER a reason to build a Constabulary that the computer does not have: today it is purely an
# Unrest tool raised in emergencies, and after this it is also a defensive building raised in a
# Region you mean to keep. A threshold rule was measured instead and would have blocked 0 of the 29,
# because on every one the holder's Standing plus the margin already exceeded the threshold.
constabulary_margin = 5
# Ticket #201 (version 0.08.1): what a Constabulary adds instead once CIVIL DEFENSE stands -- the
# eighteenth Tech, Society rung 2. Doubled rather than nudged because the Constabulary is a
# player's tool and barely a computer's: the sweep builds one in about 14% of games, so a small
# figure here would have been invisible to everyone. The Tech is the world's, as every Tech is, so
# it helps whoever HOLDS a garrisoned Region and hinders whoever wants one.
constabulary_margin_defended = 10
# Version 0.04 (ticket #46): a station's threshold starts here, plus the per-Colonist figure.
# Ticket #336 (version 0.09.0): 20 to 40 with the doubling, and it REPLACES `colony_threshold_base`
# rather than adding to it -- a station of N Colonists is 40 + 20N, exactly what a ground Colony of
# N is, where it was dearer by 20 since stations existed. The designer chose that over keeping the
# distinction.
station_threshold_base = 40
# Ticket #345 (version 0.09.1): what the Core of a Colony that was FIRST to its Body adds to its
# FOUNDER'S Allotment, every turn the founder still directs that Colony. One, a standing trickle
# rather than a second windfall, because the windfall above is the prize for arriving and this is
# the prize for staying. It is added AFTER the Faction multiplier at face value, beside the
# Spaceport's clause and for the Spaceport's reason: being first to a world is not diplomacy, and
# the Arkwrights' x0.8 has no business shaving it. It never pays a rival who takes the place, and
# it wakes again if the founder takes it back; it is keyed to that one Colony, so a second Colony
# of the founder's on the same Body pays nothing; and it keeps paying while the Colony is starved
# of Energy, where a Relay or a Chorus goes quiet -- being there first is not a thing the lights
# going out undoes.
first_settled_allotment = 1
occupation_turns = 3
# Spec 8.5: each building at a place rolls this to be destroyed. Ticket #298 (version 0.08.6): on
# ONE occasion only -- a place transferring by the three-turn clock. A Battle burns nothing, a
# Pacified transfer rolls nothing, a take by Influence never did; a Unique Facility rolls like any
# other, a Scrubber and the Archive are destroyed outright by their own rules.
destruction_chance = 0.25

# Ticket #53 (version 0.05): Blame. Every Faction wears the Emissions of the sources it controls,
# less the CO2 it removes; its share of the four Factions' total Blame above `fair_share` multiplies
# its Influence thresholds on every Nation State it does not hold, by 1 + (share - fair_share),
# floored at x1.0 and capped at `cap`. Never on a Colony or a Space Station, never on the challenge
# margin, never on Pacification.
#
# Ticket #266 (version 0.08.4): AND on Standing decay, reversing #53's "never" on purpose, at the
# designer's word ("allow blame to moderate the decay rate of influence"). A step rule, since the
# multiplier rounded to a whole number could only ever bite at the cap and never slow anything: on
# a Region the Faction does not hold, a share at or below `decay_slow_below` (half the fair quarter)
# decays `decay_slow` a turn, a share at or above `decay_fast_from` decays `decay_fast`, and
# anything between decays the plain `decay` above. A held place keeps `decay_controlled`; a Colony
# or a station is untouched -- Blame is Earth's resentment. Measured before it was built: the
# Prospectors sit at 0.54 to 0.73 in every seating and the Custodians at 0.04 to 0.13, so the fast
# side is a rule about the Prospectors and the slow side one the Custodians can reach.
[blame]
fair_share = 0.25
cap = 1.5
decay_slow_below = 0.125
decay_fast_from = 0.5
decay_slow = 1
decay_fast = 3

# Ticket #267 (version 0.08.4): the Smear campaign. Influence spent on a rival Faction rather than
# a place lays this many ppm on the rival's Blame ledger, for good -- "a kind of a lie", in the
# designer's words, since it inflates Blame above the ppm the rival produced, which is why the
# ledger and not the physics is what every rule reads. One Smear a turn per target, any amount the
# Allotment covers; an offence the Report names. For scale, measured before it was built: a table
# carries 800 to 1100 ppm of Blame at a game's end and an Allotment is 10 to 30 Influence a turn,
# so a whole Allotment at this rate moves a share by two to six points -- a step of resentment in
# a few turns of effort, not one. The sweep re-fits it.
[smear]
ppm_per_influence = 2.0

# Ticket #277 (version 0.08.5): the Greenwash, the Smear's mirror. Influence and Ducats spent on
# a Faction's own name take this many ppm off its own Blame ledger per Influence, for good, and
# every Influence spent costs `ducats_per_influence` Ducats beside it, so cleaning your name costs
# strictly more than dirtying a rival's and half a carbon credit's Ducat price per ppm, which keeps
# credits the cheap route when the Custodians are willing. One campaign a turn, any amount the two
# purses cover; public, no offence -- the Report says who greenwashed, so a rival can answer with a
# Smear. Called a greenwash because the Blame falls without a gram of CO2 leaving the air. The
# computer seats use it when their own share stands above the fair quarter, credits are not to be
# had, and they hold `ai_ducats_reserve` Ducats past the price.
[greenwash]
ppm_per_influence = 2.0
ducats_per_influence = 1
ai_ducats_reserve = 20

# Ticket #187 (version 0.08.0): Resistance. A place's schooling takes a bite out of the Influence an
# OUTSIDER spends there: Standing gained = spent / resistance, rounded down. The controller converts
# in full. It touches neither the threshold nor the challenge margin -- measured, the margin is the
# binding figure in 95% of takes of a held Region, so a threshold rule would have missed the
# contested board entirely, while a tax on the spending does not care which figure binds.
#
# `pivot` reads 1.00 and has no effect. Below it the figure scales down to `1 - band` at `low`, the
# lowest Education Level on any card; above it, up to `1 + band` at `high`, the School's ceiling.
# Each side scales to its own end because the range is asymmetric -- 0.30 below the pivot and 1.00
# above -- and a single coefficient would leave the -10% floor unreachable by any Region on the board.
[resistance]
band = 0.10
pivot = 1.0
low = 0.7
high = 2.0
