# Spec section 8.3 and 8.5.
allotment_base = 10
# allotment_per_state (3) was retired on ticket #34: each state carries its own influence figure in nation_states.toml.
state_threshold_base = 20
state_threshold_per_size = 10
colony_threshold_per_colonist = 10
decay = 2
# Ticket #33 (version 0.03): standings persist; a place you control decays slower. A challenger
# needs a standing above the controller's and at least the threshold.
decay_controlled = 1
# Version 0.04 (ticket #41): a challenger needs the controller's standing plus this margin, so a
# contested place changes hands after a push of a few turns rather than every turn.
challenge_margin = 10
# Version 0.04 (ticket #46): a station's threshold starts here, plus the per-Colonist figure.
station_threshold_base = 20
occupation_turns = 3
destruction_chance = 0.25

# Ticket #53 (version 0.05): Blame. Every Faction wears the Emissions of the sources it controls,
# less the CO2 it removes; its share of the four Factions' total Blame above `fair_share` multiplies
# its Influence thresholds on every Nation State it does not hold, by 1 + (share - fair_share),
# floored at x1.0 and capped at `cap`. Never on a Colony or a Space Station, never on the challenge
# margin, never on Standing decay, never on Pacification.
[blame]
fair_share = 0.25
cap = 1.5
