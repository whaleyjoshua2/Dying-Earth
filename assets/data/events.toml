# Spec section 13, amended by ticket #25 (version 0.02) and #32 (0.03): no Calm Cards. Ticket #76
# (version 0.05.5): the deck holds FORTY cards for a thirty-six-turn game: the twenty-eight of before
# (ten first-playable Events twice, eight later ones once), a third copy of Heatwave, Wildfire, Rich
# Seam and Solar Storm, a second copy of Unrest, Methane Burst, Labour Dispute and Dust Storm, and
# four new Events once each (Drought, Volcanic Eruption, Moonquake, Helium-3 Vein). Each turn a card
# is drawn with draw_chance_base at +1.2 C, rising by draw_chance_per_step for every full
# draw_chance_step_degrees above it (50% at +1.2, 72.5% at +3.0). The deck is never reshuffled.
# Climate cards still scale by 1 + (Temperature - 1.2) / 2.

draw_chance_base = 0.5
draw_chance_per_step = 0.025
draw_chance_step_degrees = 0.2
solar_maximum_multiplier = 1.5
solar_maximum_multiplier_with_tech = 2.0
methane_emissions = 2.5
meteor_damage = 1
# Ticket #52 (version 0.05): the Unrest card is a flat rise in the state's Unrest now; the Army
# damage and the Standing loss it used to carry are gone.
unrest_card_unrest = 3.0
reactor_leak_energy = 5
breakthrough_research = 15
breakthrough_research_public_science = 25
discovery_multiplier = 2.0
discovery_multiplier_with_tech = 3.0
discovery_turns = 2
heatwave_loss = 0.05
heatwave_loss_green_consensus = 0.025
wildfire_emissions = 2.0
# Ticket #76 (version 0.05.5): the four new Events' figures. A Drought halves a state's Facilities
# at the next Income and raises its Unrest by this much (flat: the one Climate card the Temperature
# scale does not reach, since a halving cannot scale); a Volcanic Eruption takes this many ppm from
# the CO2 Stock at once, scaled like every Climate card; a Helium-3 Vein reads the discovery
# figures above, as Rich Seam does.
drought_output_multiplier = 0.5
drought_unrest = 1.0
volcanic_co2 = 5.0

[[event]]
id = "solar_storm"
name = "Solar Storm"
kind = "solar"
target = "everyone"
effect = "No transit advances this turn"
blunted_by = "efficient_transit"
copies = 3

[[event]]
id = "radiation_surge"
name = "Radiation Surge"
kind = "solar"
target = "everyone"
effect = "Every Ship in transit takes 1 damage"
blunted_by = "hardened_hulls"
copies = 2

[[event]]
id = "comms_blackout"
name = "Comms Blackout"
kind = "solar"
target = "everyone"
effect = "Every stack fights as if its Stance were Hold"
blunted_by = "public_science"
copies = 2

# Version 0.03 (ticket #32): these two replaced Equipment Failure and Launch Failure, which singled
# out a Faction. They hit a place, so whoever holds it takes the blow. Once each: the deck is 28 cards.
[[event]]
id = "launch_pad_fire"
name = "Launch Pad Fire"
kind = "failure"
target = "nation_state_with_launch_site"
effect = "Its Launch Site is offline until the next Resolution; any Ship due there this turn completes next turn instead"
blunted_by = "clean_propellant"
copies = 1

[[event]]
id = "labour_dispute"
name = "Labour Dispute"
kind = "failure"
target = "nation_state"
effect = "Its Facilities make nothing at the next Income"
blunted_by = "public_science"
copies = 2

[[event]]
id = "grid_failure"
name = "Grid Failure"
kind = "failure"
target = "colony"
effect = "Its Modules are offline until the next Resolution"
blunted_by = "closed_loop_colonies"
copies = 2

[[event]]
id = "rich_seam"
name = "Rich Seam"
kind = "discovery"
target = "body"
effect = "Its Mines produce x2 for two turns"
blunted_by = "deep_mining"
copies = 3

[[event]]
id = "ice_deposit"
name = "Ice Deposit"
kind = "discovery"
target = "body"
effect = "Its Refineries produce x2 for two turns"
blunted_by = "automated_refining"
copies = 2

[[event]]
id = "breakthrough"
name = "Breakthrough"
kind = "discovery"
target = "tech"
effect = "+15 Research to the Tech under research"
blunted_by = "public_science"
copies = 2

[[event]]
id = "heatwave"
name = "Heatwave"
kind = "climate"
target = "nation_state"
effect = "Population -5% now"
blunted_by = "green_consensus"
copies = 3

[[event]]
id = "wildfire"
name = "Wildfire"
kind = "climate"
target = "nation_state"
effect = "One Facility offline until next Resolution; +2.0 Emissions next turn"
