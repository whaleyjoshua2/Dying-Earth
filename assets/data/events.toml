# ---------------------------------------------------------------------------------------------
# Ticket #337 (version 0.09.0): THE EIGHTEEN CHOICE CARDS, decided by the designer on 2026-09-23
# and 2026-09-24. Each is an [[event]] row like any other, marked by its [event.choice] table.
#
# `take_does` and `refuse_does` are lists of effects from the vocabulary; an effect whose target is
# not on a seat's board cannot land, and a side one of whose effects cannot land is a side that
# does not reach that seat. A seat a side does not reach is not asked at all, and the Report says
# so for it -- which is how a Faction holding no Region escapes the Hard Winter without being made
# to refuse it for being small.
#
# `take_when` is the rule a COMPUTER seat answers by, read off its own board: the rule holds and
# the seat takes the offer, it does not and the seat refuses. The figures are the card's, so they
# live here rather than in ai.toml. None of these rules is the designer's; they are a first
# reading of each card, named for correction.
# ---------------------------------------------------------------------------------------------

[[event]]
id = "refugee_convoy"
name = "Refugee Convoy"
kind = "choice"
target = "seat"
effect = "Take the convoy in, or turn it away"
copies = 1
[event.choice]
question = "A convoy of climate refugees asks to land. Take them in?"
take = "Take them in"
refuse = "Turn them away"
# A calm Faction has room for them; a restive one does not, and pays for saying so.
take_when = { rule = "unrest_below", unrest = 4.0 }
[[event.choice.take_does]]
effect = "population_to_most_populous"
population = 0.4
[[event.choice.take_does]]
effect = "emissions_next"
ppm = 2.0
[[event.choice.refuse_does]]
effect = "standing_all_held"
standing = -5

[[event]]
id = "grounded_fleet"
name = "Grounded Fleet"
kind = "choice"
target = "seat"
effect = "Ground the fleet this turn, or fly through it"
copies = 1
[event.choice]
question = "The flight surgeons want every hull grounded this turn. Ground the fleet?"
take = "Ground the fleet"
refuse = "Fly on"
# Nothing under way costs nothing to ground; a crossing in progress is worth a point of damage.
take_when = { rule = "no_landing_under_way" }
[[event.choice.take_does]]
effect = "hold_ships"
[[event.choice.refuse_does]]
effect = "damage_ships"
damage = 1

