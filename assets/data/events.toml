# Spec section 13, amended by ticket #25 (version 0.02) and #32 (0.03): no Calm Cards. Ticket #76
# (version 0.05.5): the deck holds FORTY cards for a thirty-six-turn game. Each turn a card is
# drawn with draw_chance_base at +1.2 C, rising by draw_chance_per_step for every full
# draw_chance_step_degrees above it (50% at +1.2, 72.5% at +3.0). The deck is never reshuffled.
# Climate cards still scale by 1 + (Temperature - 1.2) / 2.
#
# Ticket #337 (version 0.09.0): the deck is still FORTY cards and now every one of them is
# DISTINCT. Fourteen kinds carried eighteen extra copies between them; every extra copy is cut
# (`copies = 1` throughout) and eighteen CHOICE cards take their places, one copy each. A choice
# card is drawn at the start of the turn, before orders; every seat is asked the same card; and
# End Turn is refused until a human seat has answered. What the two answers do is composed from
# the effect vocabulary below, so the eighteen are rows in this file and not code. Every figure
# any of them moves is a field here.

draw_chance_base = 0.5
draw_chance_per_step = 0.025
draw_chance_step_degrees = 0.2
solar_maximum_multiplier = 1.5
solar_maximum_multiplier_with_tech = 2.0
methane_emissions = 2.5
meteor_damage = 1
# Ticket #52 (version 0.05): the Unrest card is a flat rise in the state's Unrest now; the Army
# damage and the Standing loss it used to carry are gone.
unrest_card_unrest = 3.0
reactor_leak_energy = 5
breakthrough_research = 15
breakthrough_research_public_science = 25
discovery_multiplier = 2.0
discovery_multiplier_with_tech = 3.0
discovery_turns = 2
heatwave_loss = 0.05
heatwave_loss_green_consensus = 0.025
wildfire_emissions = 2.0
# Ticket #76 (version 0.05.5): the four new Events' figures. A Drought halves a state's Facilities
# at the next Income and raises its Unrest by this much (flat: the one Climate card the Temperature
# scale does not reach, since a halving cannot scale); a Volcanic Eruption takes this many ppm from
# the CO2 Stock at once, scaled like every Climate card; a Helium-3 Vein reads the discovery
# figures above, as Rich Seam does.
drought_output_multiplier = 0.5
drought_unrest = 1.0
# Ticket #257 (version 0.08.4): a Storm Surge that breaks on a standing Sea Wall no longer brings the
# state's next threshold forward -- the wall holds it, as it holds every threshold now. Instead the
# Facilities in the state's coastal slots make this much of their output at the next Income, once,
# at the designer's word: "reduce by 30% the output of coastal slots for the next turn". The card's
# Unrest lands as before. An unwalled state takes the threshold early, as it always has.
storm_surge_coastal_multiplier = 0.7
# Ticket #259 (version 0.08.4): the seven cards that can only land off Earth -- Grid Failure,
# Reactor Leak, Dust Storm, Moonquake, Helium-3 Vein, Rich Seam, Ice Deposit; `off_earth = true`
# on each -- are NOT in the deck when the game starts. They join it on this turn, shuffled into
# whatever remains, at the designer's word: "flag them as off earth and add them to deck on turn
# 12". Measured before the change over five headless games: about 20 cards drawn a game and 4 of
# them found nowhere to land, chiefly these seven, each spent for the game -- the deck is never
# reshuffled. The median first Colony is founded on turn 10.
off_earth_join_turn = 12
volcanic_co2 = 5.0

