# Spec section 13, amended by ticket #25 (version 0.02): no Calm Cards. The deck holds thirty cards,
# the twelve first-playable Events twice and the six new ones once. Each turn a card is drawn with
# draw_chance_base at +1.2 C, rising by draw_chance_per_step for every full draw_chance_step_degrees
# above it (50% at +1.2, 72.5% at +3.0). The deck is never reshuffled.
# Climate cards still scale by 1 + (Temperature - 1.2) / 2.

draw_chance_base = 0.5
draw_chance_per_step = 0.025
draw_chance_step_degrees = 0.2
solar_maximum_multiplier = 1.5
solar_maximum_multiplier_with_tech = 2.0
permafrost_emissions = 3.0
meteor_damage = 1
unrest_army_damage = 2
unrest_influence_loss = 5
reactor_leak_energy = 5
breakthrough_research = 15
breakthrough_research_public_science = 25
discovery_multiplier = 2.0
discovery_multiplier_with_tech = 3.0
discovery_turns = 2
heatwave_loss = 0.05
heatwave_loss_green_consensus = 0.025
wildfire_emissions = 2.0

