refuse = "Let it go to market"
take_when = { rule = "ducats_at_least", ducats = 20 }
[[event.choice.take_does]]
effect = "resources"
materials = 30
ducats = -20
[[event.choice.refuse_does]]
effect = "trade_price"
resource = "materials"
to = 1
turns = 2

