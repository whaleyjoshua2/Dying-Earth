# Spec section 4.1. Yields multiply what a Module produces, never what it costs.
# transit_turns and transit_delta_v are from Earth (the Moon counts as Earth for reach). A Body with a
# parent is that parent's satellite: local_turns and local_delta_v are the hop between them, and two
# satellites of the same parent are sibling_turns and sibling_delta_v apart (ticket #45).
# Every Colony Slot is a real place on its Body, at its approximate longitude and latitude (east
# positive), and a Colony there takes its name (ticket #45).

sibling_turns = 1
# Ticket #485 (version 0.09.8): **a leg's Fuel is its real delta-v times one scale.** Every leg below
# carries its delta-v in km/s, orbit to orbit, from `docs/research/delta-v.md`: a Ship brakes on air
# where there is air, as missions have flown it -- a burn into a loose orbit, then months of passes
# through the upper air (Mars, Venus, and a little at Phobos; none at the Moon or Deimos). The scale is the designer's: 4 Fuel a km/s, after 4.5 was swept and found no different.
# Phobos to Deimos is 0.75 km/s. Ticket #486 prices every other journey: see the foot of this file.
fuel_per_delta_v = 4.0
sibling_delta_v = 0.75

# Ticket #335 (version 0.09.0): moving a Ship between two orbits of one Body -- low orbit and the
# Orbital Slots -- is an order costing this much Fuel from the Ship's own tank, the sibling hop's
# figure at the designer's word. Refused below it.
orbit_change_fuel = 1
# Ticket #480 (version 0.09.8): a FAR ORBIT -- Earth's L4 and L5 -- is farther out. A move to or from
# one costs its delta-v in Fuel from the tank and a turn, from any other orbit of its Body; a leg between
# Bodies pays it on top of the crossing for a far orbit it leaves and for one it names to arrive in.
# A far orbit is reached only by Ship: its station is founded by a Colony Ship in it, as at Venus,
# never built from a Launch Site, and no lift reaches it. A Body's `far_slots` are the LAST that many
# of its Orbital Slots.
# Version 0.04 (ticket #46): a Space Station is built for this many Materials into a free orbital
# slot, from a Nation State with a Launch Site (over Earth) or a Colony (elsewhere); no crew needed.
# It holds only a Shipyard and Habitats. Ships are built only at Shipyards. Each Body names its
# orbital slots in `stations`, in order. Ticket #50: five over Earth. The Custodians start with the
# ISS, the Prospectors with Tiangong and the Archivists with Axiom; the Arkwrights start with none,
# and two slots stand free.
station_materials = 40
# Ticket #57 (version 0.05): every Colony Slot draws its own four yields when the game starts, its
# Body's figures times a factor from a triangular distribution centred on 1.0 with these limits.
slot_yield_spread = 0.25

# Ticket #345 (version 0.09.1): FIRST TO A BODY. The Faction that founds the first ground Colony a
# Body has ever carried is paid `first_windfall` Influence, once, into the turn after the landing --
# a prize for reaching a new world before anybody else, never paid twice and never paid again if the
# Colony is lost and retaken. Every Body carries the figure, and a row without it refuses the table:
# a Body whose prize this build cannot price is a rule half-written, and paying nothing quietly is
# the one answer that would never be noticed.
#
# The figures rise with the voyage, since the prize is for the distance and the risk: the Moon is one
# turn and 6 Fuel away and pays 5; Mars is four turns and 20 Fuel and pays 15; Phobos and Deimos are
# five turns and 24 Fuel, at the end of the longest leg on the board, and pay 20. Earth pays 0 --
# Antarctica is on Earth and claims nothing -- and Venus pays 0 because Venus has no ground slots at
# all, so nothing can ever land there to claim it. Venus keeps a figure rather than none so that the
# day a Colony Slot is given to Venus the rule turns on with a number already in its row.

[[body]]
id = "earth"
name = "Earth"
# Ticket #345: Antarctica is on Earth, so an Antarctic founding claims no first and pays nothing.
first_windfall = 0
# Version 0.04 (ticket #44): Antarctica is Earth's three Colony Slots, founded by a Colony Ship at
# Earth with no transit. Cold and Fuel-leaning: good for Refineries, poor for Habitats and Generators.
# Its Colonists live on Earth (no Off-world Presence) and its Modules emit like Facilities.
transit_turns = 0
leave_delta_v = 3.2
arrive_delta_v = 0.54
# Ticket #397 (version 0.09.3): what a Trade Post anywhere is paid a turn for the Faction holding
# this Body (a Colony, a station or, on Earth, a Region), by its distance from Earth: the designer's
# Earth 3, the Moon 3.5, Venus 4, Mars 5, Phobos 6, Deimos 6, where a flat 3 stood for every Body.
trade_pays = 3
# Ticket #56 (version 0.05): abundant ore and Fuel under the ice, and Habitats that work as well as
# anywhere. The slots stay shut until the Temperature has stood at antarctica_opens_at (climate.toml).
mine_yield = 1.75
generator_yield = 0.75
refinery_yield = 2.0
research_yield = 1.0
orbital_slots = 7
stations = ["ISS", "Tiangong", "Axiom", "Orbital Reef", "Starlab", "Earth L4", "Earth L5"]
far_slots = 2
slots = [
    { name = "Antarctic Peninsula", lon = -63.0, lat = -69.0 },
    { name = "Lake Vostok", lon = 105.0, lat = -77.5 },
    { name = "Ross Ice Shelf", lon = -178.0, lat = -81.0 },
]

