# Ticket #486 (version 0.09.8): **every journey is priced the same way**, each direction for itself.
# Inside a system a hop has its own figure: a satellite's `local_delta_v` out to it from its parent
# and `local_return_delta_v` back, and `sibling_delta_v` between two satellites of one parent.
# Between two systems a journey is the LEAVING of one end (`leave_delta_v`), the GULF between the
# two systems below, and the ARRIVING at the other (`arrive_delta_v`), which is lower where there
# is air to brake on: Earth, Venus, Mars and a little at Phobos. A far orbit, Earth L4 or L5, is a
# system of its own for travel and costs nothing to leave or to arrive in, being outside every
# gravity well. The figures are section 3.9 of `docs/research/delta-v.md`; they reproduce its
# table of every pair to 0.18 km/s at worst (one far orbit to the other) and 0.01 nearly everywhere.
[[gulf]]
between = ["earth", "venus"]
delta_v = 0.64
[[gulf]]
between = ["earth", "mars"]
delta_v = 1.07
[[gulf]]
between = ["earth", "far"]
delta_v = 0.87
[[gulf]]
between = ["venus", "mars"]
delta_v = 3.48
[[gulf]]
between = ["venus", "far"]
delta_v = 2.85
[[gulf]]
between = ["mars", "far"]
delta_v = 3.62
[[gulf]]
between = ["far", "far"]
delta_v = 2.66

