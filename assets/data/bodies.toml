# Spec section 4.1. Yields multiply what a Module produces, never what it costs.
# transit_turns and transit_fuel are from Earth (the Moon counts as Earth for reach). A Body with a
# parent is that parent's satellite: local_turns and local_fuel are the hop between them, and two
# satellites of the same parent are sibling_turns and sibling_fuel apart (ticket #45).
# Every Colony Slot is a real place on its Body, at its approximate longitude and latitude (east
# positive), and a Colony there takes its name (ticket #45).

sibling_turns = 1
sibling_fuel = 1
# Version 0.04 (ticket #46): a Space Station is built for this many Materials into a free orbital
# slot, from a Nation State with a Launch Site (over Earth) or a Colony (elsewhere); no crew needed.
# It holds only a Shipyard and Habitats. Ships are built only at Shipyards. Each Body names its
# orbital slots in `stations`, in order. Ticket #50: five over Earth. The Custodians start with the
# ISS, the Prospectors with Tiangong and the Archivists with Axiom; the Arkwrights start with none,
# and two slots stand free.
station_materials = 40
# Ticket #57 (version 0.05): every Colony Slot draws its own four yields when the game starts, its
# Body's figures times a factor from a triangular distribution centred on 1.0 with these limits.
slot_yield_spread = 0.25

[[body]]
id = "earth"
name = "Earth"
# Version 0.04 (ticket #44): Antarctica is Earth's three Colony Slots, founded by a Colony Ship at
# Earth with no transit. Cold and Fuel-leaning: good for Refineries, poor for Habitats and Generators.
# Its Colonists live on Earth (no Off-world Presence) and its Modules emit like Facilities.
transit_turns = 0
transit_fuel = 0
# Ticket #56 (version 0.05): abundant ore and Fuel under the ice, and Habitats that work as well as
# anywhere. The slots stay shut until the Temperature has stood at antarctica_opens_at (climate.toml).
mine_yield = 1.75
generator_yield = 0.75
refinery_yield = 2.0
habitat_yield = 1.0
orbital_slots = 5
stations = ["ISS", "Tiangong", "Axiom", "Orbital Reef", "Starlab"]
slots = [
    { name = "Antarctic Peninsula", lon = -63.0, lat = -69.0 },
    { name = "Lake Vostok", lon = 105.0, lat = -77.5 },
    { name = "Ross Ice Shelf", lon = -178.0, lat = -81.0 },
]

[[body]]
id = "moon"
# Ticket #92 (version 0.06.0): a small world, where a Mass Driver may stand.
low_gravity = true
name = "the Moon"
parent = "earth"
local_turns = 1
local_fuel = 6
transit_turns = 1
transit_fuel = 6
# Ticket #72 (version 0.05.5): all four up a tenth (1.5, 1.25, 0.5, 1.0 before).
mine_yield = 1.65
generator_yield = 1.375
refinery_yield = 0.55
habitat_yield = 1.1
orbital_slots = 2
stations = ["Gateway", "Selene"]
slots = [
    { name = "Mare Tranquillitatis", lon = 31.4, lat = 8.5 },
    { name = "Mare Imbrium", lon = -15.6, lat = 32.8 },
    { name = "Tycho", lon = -11.4, lat = -43.3 },
    { name = "South Pole-Aitken Basin", lon = -171.0, lat = -53.0 },
]

[[body]]
id = "mars"
name = "Mars"
transit_turns = 4
transit_fuel = 20
mine_yield = 1.25
generator_yield = 0.75
refinery_yield = 1.5
habitat_yield = 1.5
orbital_slots = 3
stations = ["Mars Base Camp", "Ares", "Hermes"]
slots = [
    { name = "Olympus Mons", lon = -133.8, lat = 18.7 },
    { name = "Valles Marineris", lon = -70.0, lat = -14.0 },
    { name = "Chryse Planitia", lon = -30.0, lat = 28.0 },
    { name = "Hellas Planitia", lon = 70.0, lat = -42.4 },
    { name = "Isidis Planitia", lon = 88.0, lat = 12.9 },
    { name = "Elysium Planitia", lon = 135.0, lat = 3.0 },
]

# Version 0.04 (ticket #45): the moons of Mars, one hop past it. Phobos the mining rock, Deimos
# the quiet site. Five turns and 24 Fuel from Earth; one turn and 2 Fuel from Mars; one turn and
# 1 Fuel between them.
[[body]]
id = "phobos"
low_gravity = true
name = "Phobos"
parent = "mars"
local_turns = 1
local_fuel = 2
transit_turns = 5
transit_fuel = 24
mine_yield = 1.75
generator_yield = 0.75
refinery_yield = 0.5
habitat_yield = 0.5
orbital_slots = 1
stations = ["Phobos Gateway"]
slots = [
    { name = "Stickney", lon = -50.0, lat = 1.0 },
    { name = "Roche", lon = 177.0, lat = 53.0 },
]

[[body]]
id = "deimos"
low_gravity = true
name = "Deimos"
parent = "mars"
local_turns = 1
local_fuel = 2
transit_turns = 5
transit_fuel = 24
mine_yield = 1.0
generator_yield = 1.0
refinery_yield = 0.25
habitat_yield = 0.5
orbital_slots = 1
stations = ["Deimos Gateway"]
slots = [
    { name = "Swift", lon = -2.0, lat = 12.5 },
]

# Version 0.06.0 (ticket #93): Venus, a Body of orbits only. Three turns and 16 Fuel from Earth on
# its own Launch Window (ephemeris.toml, `[transit_venus]`); legs from the Earth system only. No
# Colony Slots, so nothing lands and no Body yield is ever read; three Orbital Slots, Venus's three
# highlands, where everything at Venus is built and held. Colonists on a station there are off
# Earth for every rule, and a station there is Venus for the Arkwrights' Diaspora.
[[body]]
id = "venus"
name = "Venus"
transit_turns = 3
transit_fuel = 16
mine_yield = 1.0
generator_yield = 1.0
refinery_yield = 1.0
habitat_yield = 1.0
orbital_slots = 3
stations = ["Ishtar", "Aphrodite", "Lada"]
slots = []
