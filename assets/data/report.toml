# Ticket #58: every sentence the Report says.
#
# The Report is a dated dispatch: one headline chosen by severity, then the lines that are left
# grouped under In space, On Earth, The climate and Your works, then what each rival Faction did in
# plain words. Every one of those sentences is a template here, with named placeholders in braces.
#
# The engine declares, per key, the placeholders it supplies (`report::TEMPLATE_ARGS`). Loading the
# tables checks three things and refuses the file otherwise: every declared key is present, no key
# here is unknown, and every placeholder a template uses is one the engine supplies for that key.
#
# The engine's own log lines are NOT here. The simulate log reads them and they say the same thing
# in the same words; these are the Report's copy, and they are what a change of wording changes.

# ---------------------------------------------------------------- the dispatch, line by line
[line]

# Turn 1 only: the headline that explains the table.
seating = "{date}. You play the {faction} from {state}; the computer plays {rivals}."
start_holding = "You hold {state} with a Launch Site and its Standing Army. The Stockpile holds {materials} Materials, {fuel} Fuel and {energy} Energy."
start_rivals = "Your rivals are {rivals}. Build, spread Influence, and get twelve Colonists off Earth before the Temperature reaches +{collapse} C."

# In space
solar_storm = "Solar Storm: no transit advanced this turn."
ship_arrived = "{faction} {ship} arrived at {body}."
ship_destroyed = "{faction} {ship} destroyed ({why}){cargo}."
event_damaged_ships = "{event} damaged {n} Ship(s)."
loaded = "{faction} loaded {cargo} at {body}."
slot_taken = "{faction}: another Faction took that Colony Slot first."
landing_contested = "{faction} could not land at {body}: the orbit is contested."
colony_founded = "The {faction} founded a Colony in slot {slot} on {body} with {n} Colonists."
disembarked = "{n} Colonists disembarked into {colony}."
station_built = "{faction} built {station}."
antarctica_opens = "The Antarctic ice opens: {n} Colony Slots on Earth."
archive_begun = "The {faction} began the Archive at {colony}."
claim_lot = "{place} is claimed by {factions} at the same Standing; the lot falls to the {winner}."
emigrants_mustered = "{n} Pioneers recruited in {state}; its Unrest fell by {fell} to {unrest}."
emigrants_arrived = "{n} Pioneers from {state} landed in Antarctica and joined {colony}."
emigrants_returned = "{n} Pioneers from {state} found no room in Antarctica and came home."
emigrants_lifted = "{n} Pioneers lifted from {state} to {station}."
neutral_research = "The Labs of {states}, in no one's hands, added {n} Research to the Tech under research."
archive_built = "The {faction} raised the Archive at {place}; it wants {left} more Research."
archive_complete = "The {faction} completed the Archive at {place}: it stands, and every point of its Research is paid."
archive_destroyed = "The Archive at {place} was destroyed when the Colony passed out of the {faction}' hands; their Archive fund is kept."
archive_funded = "The {faction} are funding the Archive: {banked} Research banked, {fund} of {cap} in the fund."
# Ticket #235 (version 0.08.3): the other three Research Directives. Each says what was given up as
# well as what was got, because the whole of the decision is the trade.
exodus_call = "The {faction} sounded an Exodus Call in {state}: {n} Pioneers a turn for {turns} turns, at the ordinary cost in people."
exodus_call_order = "sounded an Exodus Call in {state}"
directive_sink = "The {faction} directed {research} Research into the Natural Sink: {ppm} ppm more, for good, and the Sink now takes {sink} ppm a turn."
directive_ducats = "The {faction} directed {research} Research into their coffers: {n} Ducats."
directive_fuel = "The {faction} directed {research} Research into propellant: {n} Fuel."

# On Earth
army_moved = "{faction} Army moved from {from} to {to}{attacks}."
army_landed = "{faction} landed an Army at {colony}."
units_destroyed = "{place} was {why}: {lost} destroyed."
occupation_begun = "The {faction} occupy {place}."
occupation_ended = "Occupation of {place} by the {faction} ended."
control_changed = "{place} now belongs to the {faction} ({why})."
claim_tied = "{place} is claimed by {factions} at the same Standing; it stays as it is."
threw_off = "{state} threw off the {faction}: it is neutral again, its Armies are its own, and its Unrest settles at {unrest}."
unrest_rose_state = "{state}: Unrest rose by {rose} to {unrest}."
unrest_card = "Unrest in {state}: its Unrest rose by {rose} to {unrest}."
unrest_threshold = "{state}: Unrest reached {unrest} - {note}."
relief = "The {faction} paid Relief in {state}: Unrest fell by {fell} to {unrest}."
# Ticket #176 (version 0.07.6): one NET line per Region, and only when the net is worth at least
# half a person. What a Region lost to each cause and what it took in used to speak separately, so a
# hot turn spent up to 39 lines of a 74-line Report on refugees. Unrest is still charged on everyone
# who arrived, so where the gross differs from the net the line names both; otherwise the Unrest
# figure would be charged on a number the line never gives.
refugees_net_in = "{state} took in {n} people; Unrest rose by {rose} to {unrest}."
refugees_net_in_gross = "{state} took in {n} people of {gross} arriving; Unrest rose by {rose} to {unrest}."
refugees_net_in_quiet = "{state} took in {n} people."
refugees_net_out = "{state} lost {n} people to its neighbours: {why}."
refugees_net_out_mostly = "{state} lost {n} people to its neighbours: mostly {why}."
resettled = "The {faction} resettled this turn's refugees in {state} (+{standing} Standing there)."
strip_permit = "The {faction} issued a Strip Permit in {state}: every Facility there produces double for {turns} turns."
strip_permit_ended = "The Strip Permit in {state} ran out: its Baseline Emissions stand at {baseline} for good, and its Unrest rose by {rose} to {unrest}."
building_changed_state = "The {faction} {done} the {building} in {state}."
building_decommissioned_state = "The {faction} decommissioned the {building} in {state}: {refund} Materials back and its slot free."
building_changed_colony = "The {faction} {done} the {building} at {colony}."
building_decommissioned_colony = "The {faction} decommissioned the {building} at {colony}: {refund} Materials back."
build_lost = "{building} at {place} had no slot left and was lost."
# Ticket #197 (version 0.08.0): Colonists lost when a building coming down leaves fewer Habitats
# than the people living there. It was the one way Colonists went without a word.
colonists_no_room = "{n} Colonists at {colony} had nowhere to live and were lost."
# Ticket #191 (version 0.08.0): Relations. Said in the OFFENDER's Report on a turn a rival's view of
# them fell, so a player is sent to the grid on the Victory window rather than expected to watch it.
# Ticket #192 (version 0.08.0): the Upload, in the Report.
uploaded = "{n} Colonists were uploaded into the Archive at {colony}: {total} in all."
relations_fell = "The {victim} have not forgiven the {offender}."
launch_pad_fire = "Launch Pad Fire: the {faction} {item} at {place} completes next turn instead."
game_over_win = "Game over on turn {turn}: the {faction} win ({note})."
game_over_draw = "Game over on turn {turn}: a draw ({note})."
game_over_collapse = "Game over on turn {turn}: Collapse at {temperature} C. Nobody wins."

# The climate
event_drawn = "{text}"
# Ticket #259 (version 0.08.4): the turn the off-Earth cards are shuffled into the deck.
deck_joined = "The {n} Events that can only land off Earth join the deck: Grid Failure, Reactor Leak, Dust Storm, Moonquake, Helium-3 Vein, Rich Seam and Ice Deposit."
# Ticket #261 (version 0.08.4): the rival's Moment, two steps. {part} is the part still short.
rival_three_quarters = "The {faction} are three quarters of the way to their Victory Condition: {part} at {value} of {bar}."
rival_one_part_met = "The {faction} have met half of their Victory Condition, {met}. Only {part} stands between them and the game, at {value} of {bar}."
# Ticket #267 (version 0.08.4): a Smear campaign, named for who paid.
smear = "The {faction} smeared the {target}: {ppm} ppm laid on their Blame."
# Ticket #268 (version 0.08.4): carbon credits.
credits_offered = "The {faction} offer {n} ppm of carbon credit a turn."
credits_bought = "The {faction} bought {n} ppm of carbon credit from the {seller} for {ducats} Ducats: off their Blame, for good."
credits_short = "The {faction} wanted {n} ppm of carbon credit more than was left on offer; {back} Ducats came back."
# Ticket #269 (version 0.08.4): Agitate, named for who paid.
agitate = "The {faction} agitated in {state}: Unrest rose by {rose} to {unrest}."
agitate_damped = "The {faction} agitated in {state}, and the Constabulary there held it to nothing."
break_fired = "Break at {temperature} C - {name}. {happened} {text}"
break_coastal = "{states}: every state at Coastal Exposure {exposure} lost {percent}% of its people and took {unrest} Unrest."
break_baseline = "{state}: its Baseline Emissions rise by {rise} for good."
# Ticket #257 (version 0.08.4): the wall stands, and each rise it holds makes it dearer to keep.
# The designer's line: "The Sea Wall in China took the sea, rising sea levels have increased the
# cost to maintain this Sea Wall".
sea_wall = "The Sea Wall in {state} took the sea at {temperature} C; the risen water makes it dearer to keep, {keep} Materials a turn now."
storm_surge_wall = "Storm Surge in {state}: the Sea Wall held. Its coastal Facilities make {percent}% less at the next Income."
sea_wall_unkept = "Materials ran short: the Sea Wall in {states} stands unkept this turn and holds nothing."
sea_nothing_left = "Sea level at {temperature} C: {state} has no coastal slots left to lose."
sea_took = "The sea took {n} coastal {slots} from {state} at {temperature} C."
sea_took_destroying = "The sea took {n} coastal {slots} from {state} at {temperature} C: {destroyed}."
heat_population = "{state}: population fell {percent}% to {after}; Unrest rose by {rose} to {unrest}."
# Ticket #106 (version 0.07.0): the same event where the fall rounds to nothing. Late in a game a
# dozen of these arrived a turn saying "population fell 0.0%", which spends a line to report that a
# country was fine; what actually moved was the Unrest, so that is all this says.
heat_unrest_only = "{state}: the heat raised Unrest by {rose} to {unrest}."
development = "{state} raised its Industry Level to {level}."
development_woke = "{state} raised its Industry Level to {level} and brought a {building} online."
scrubbers_destroyed = "{n} Scrubber(s) in {state} were destroyed when the state {why}."
leapfrog = "The {faction} Leapfrogged {state}: its people now emit {coefficient} per hundred million."

# Your works
tech_complete = "{tech} is complete; every Faction has it. The {faction} led ({shares}) and pick the next Tech."
build_complete = "{faction} completed {building} at {place}."
energy_short = "{faction}: Energy ran short; shut down {buildings}."
energy_zero = "{faction}: Energy fell to zero even with every producer off."

# ---------------------------------------------------------------- fragments other sentences use
[phrase]
attacks = " and attacks"
cargo_aboard = " with {n} Colonists aboard"
sea_unrest = " Unrest there rose by {rose} to {unrest}."
# Ticket #276 (version 0.08.5): every rise turns one inland slot coastal, wall or no wall; an empty
# slot first, else the oldest inland Facility with its slot.
sea_inland = " The coast now reaches one slot further in."
sea_inland_flipped = " The coast now reaches one slot further in: {what} stands on it now."
# Ticket #85 (version 0.06.0): the count is an ordinal ("second", "twelfth", "13th"), and a
# Colony founded in Antarctica has phrases of its own, since Antarctica is on Earth.
first_colony = "their first Colony off Earth"
more_colonies = "their {ordinal} Colony off Earth"
first_antarctic_colony = "their first Colony in Antarctica"
more_antarctic_colonies = "their {ordinal} Colony in Antarctica"
slot = "slot"
slots = "slots"
pick_first_choice = "The {faction} pick {tech}, their first choice."
pick_cheapest = "The {faction} pick {tech}, the cheapest left."
pick_last = "The {faction} pick {tech}, the one they leave until last."
you_pick = "You led. Pick the next Tech."

# ---------------------------------------------------------------- what a rival Faction did
# Each is one clause; the paragraph strings them together with the Faction's name in front.
[rival]
paragraph = "The {faction} {deeds}."
nothing = "The {faction} gave no orders this turn."
# Ticket #226 (version 0.08.2): the Accords, told as the board could see them.
propose_accord = "offered the {faction} an Accord"
end_accord = "declared their Accord with the {faction} over"
tribute = "paid the {faction} a tribute"
build_facility = "began a {building} in {state}"
build_facility_ducats = "bought a {building} in {state}"
raise_industry = "raised the Industry Level in {state}"
build_module = "began a {building} at {colony}"
build_module_ducats = "bought a {building} at {colony}"
build_ship = "began a {unit} at {place}"
build_army = "began an Army at {place}"
build_station = "began a Space Station over {body}"
build_archive = "began the Archive at {colony}"
# Ticket #192 (version 0.08.0): the Upload, in the rival-deeds paragraph.
upload = "uploaded {n} Colonists into the Archive at {colony}"
fund_archive = "set its Labs to pay the Archive fund from the next Income"
unfund_archive = "set its Labs back to the shared Tech from the next Income"
max_on = "set its whole Allotment to go to {place} every turn"
max_off = "set its Influence to be placed by hand again"
build_emigrants = "recruited {n} Pioneers in {state}"
send_antarctica = "sent {n} Pioneers from {state} to Antarctica by sea"
lift_station = "lifted {n} Pioneers from {state} to {station}"
set_venture_share = "set the Venture Capital Fund to bank {share}% of its Materials output"
# Ticket #256 (version 0.08.4): "withdrew", and DUCATS -- this line still said Materials a version
# after ticket #240 moved the Fund, which nobody saw because no sweep reads the Report.
draw_venture = "withdrew {n} Ducats from the Venture Capital Fund"
repair = "repaired {unit}"
transit = "sent a {unit} to {body}"
# Ticket #87 (version 0.06.0): the Refuel order.
refuel = "refuelled {unit} at {body}"
ship_stance = "set its Ships at {body} to {stance}"
army_stance = "set its Armies at {place} to {stance}"
move_army = "moved an Army into {state}"
load_colonists = "lifted {n} Colonists at {place}"
load_army = "loaded an Army at {place}"
unload = "unloaded at {place}"
influence = "spent {n} Influence on {place}"
buy_influence = "bought {n} Influence"
buy = "bought {n} {resource}"
sell = "sold {n} {resource}"
relief = "paid Relief in {state}"
smear = "spent {n} Influence smearing the {faction}"
offer_credits = "offered {n} ppm of carbon credit a turn"
buy_credits = "bought {n} ppm of carbon credit"
agitate = "agitated in {state}"
resettle = "resettled its refugees in {state}"
mothball = "mothballed the {building} at {place}"
restart = "restarted the {building} at {place}"
decommission = "decommissioned the {building} at {place}"
leapfrog = "Leapfrogged {state}"
strip_permit = "issued a Strip Permit in {state}"
arrived = "its {unit} reached {body}"
completed = "finished {building} at {place}"
founded = "founded {colony}"

# ---------------------------------------------------------------- the Moments
# A Moment is a short modal shown before the Report: one sentence and one number. `on` is the
# default; the Moments corner at the foot of the Report remembers a change for the session.
[moments.colony_founded]
on = true
text = "The {faction} founded {colony}, {note}."
figure = "{n} Colonists"

[moments.control_changed]
on = true
text = "{place} changed hands."
figure = "the {faction}"

[moments.climate_threshold]
on = true
text = "{what}"
figure = "{figure}"

[moments.decisive_battle]
on = true
text = "A Battle at {place}: {result}"
figure = "{figure}"

# Ticket #261 (version 0.08.4): a rival closing on its Victory Condition -- three quarters of the
# way, or one part met with the other short -- once a step, rivals only, in the rival's colour.
[moments.rival_progress]
on = true
text = "{text}"
figure = "{figure}"

# Ticket #86 (version 0.06.0): Colonists lost to crowding on a Colony Ship's arrival.
[moments.lost_in_transit]
on = true
text = "{n} of the {of} crowded aboard the {faction}' {ship} died on the way to {body}."
figure = "{n} lost"

[moments.tech_complete]
on = true
text = "{tech} is complete. The {faction} led, {lead} of {cost}."
figure = "{lead} of {cost}"

[moments.antarctica]
on = true
text = "The Antarctic ice opens: Colony Slots on Earth for the first time."
figure = "{n} Colony Slots"

[moments.archive_complete]
on = true
text = "The {faction} completed the Archive at {place}."
figure = "{research} Research paid"
