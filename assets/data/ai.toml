[multipliers]
victory_gap_max = 3.0
threat = 2.0
opportunity = 2.0
energy_shortage_bonus = 2
# Ticket #181 (version 0.08.0): the bias a seat gets toward its OWN Unique Facility over the common
# counterpart -- the designer asked for "only a slight bias", and slight is what this is. It is kept
# small on purpose: ticket #41 taught the AI to chase Ducats and it cost the Custodians every win in
# twenty seeds, because a Bank on turn 1 displaced the Research Lab.
unique_bias = 1.15
# Ticket #182: the Prospectors are the exception to that bias. An Investment Bank pays 1% of the
# Venture Capital Fund's balance, so its worth grows with the Fund, and the computer's appetite is
# made to grow with it: the weight is multiplied by 1 + balance x this. At the measured median Fund
# of 400 by turn 24 that is x1.8, and at 1000 -- the bar itself -- x3.0. Early, with an empty Fund,
# an Investment Bank is worth nothing and loses to the Factory that fills the Fund, which is right.
investment_bank_per_fund = 0.002
# Ticket #209 (version 0.08.1): the Archive may no longer stand in Earth orbit, which is the only
# place it has ever stood -- ordered there on turn 1 in 80 of 80 measured games. Narrowing the rule
# stops the computer ordering in orbit, because its Archive push already filters on the same
# function, but nothing in it makes the Archivists GO anywhere. They already weight founding a
# Colony at 9 and a Colony Ship at 8 and never cash either in, since Antarctica and Earth orbit are
# so much cheaper than a transit that nothing further ever wins the comparison. So while they have
# nowhere the Archive may stand, the whole chain that carries them to one -- Colony Ship, Launch
# Site or Shipyard, load, transit, founding -- is multiplied by this. It applies to no other
# Faction and stops the moment they hold such a place. Ticket #192's warning that a computer not
# taught the new move wins nothing at all proved right; this is the same shape, so the appetite is
# added deliberately rather than hoped for.
#
# 5.0, chosen by sweeping it. At 2.0 the Archivists won 2 games of 80 and the Archive stood in 40;
# at 5.0 they win 5 and it stands in 37 -- so the appetite is NOT what binds them, and more of it
# buys very little. What binds them is the journey itself, which eats about twenty turns of a
# thirty-six-turn game. 5.0 was taken anyway, at the designer's word, because the whole table reads
# better there than at any figure measured so far: Custodians 43, Prospectors 13, Arkwrights 7,
# Archivists 5, against the 58 / 18 / 3 / 0 this version started from, with no seat left on nothing.
#
# The lever held in reserve, if the Archivists are ever to be lifted without loosening the rule, is
# `banked_before_built` in modules.toml. It caps the Archive fund at a quarter of the 80 the Archive
# wants until the Module physically stands, and the sweeps show the fund sitting at exactly that cap
# -- 20 -- in three seatings of four. So the Archivists now spend the journey with their Labs'
# Research frozen as well as their Archive unplaceable: the rule charges them twice for one trip.
# That cap was set when the Archive was ordered on turn 1 in Earth orbit, where there was no journey
# to fund through, so its premise is gone even though the figure has not moved.
archive_needs_a_place = 5.0

# Pace (spec 16.3), stretched to twenty-four turns on ticket #27 and keyed per Faction on #50.
# `first` is the Faction's first Victory part by turn, as [turn, value]; a Faction whose first part
# is a Stabilization run has no useful interpolation, so it names ppm figures instead: within
# `within_ppm` of the Sink by `within_by_turn`, and under it by `under_sink_by_turn`.
# `colonists` is the Colonists off Earth the Faction should hold, as [turn, colonists].

# Ticket #72 (version 0.05.5): the pace is Materials banked in the Venture Capital Fund, by turn 34
# of thirty-six; the AI sets its share each turn to stay on it.
# Ticket #182 (version 0.08.0): the bar moved from 750 to 1000, so the whole schedule is RESCALED by
# 1000/750 rather than given a new last number -- it is what makes the computer set its banking share
# every turn, and leaving the early marks where they were would have it bank too little until turn 27
# and then find the last stretch impossible.
[pace.prospectors]
first = [[9, 133], [18, 333], [27, 600], [34, 1000]]
colonists = [[12, 4], [22, 12]]

[pace.custodians]
within_ppm = 4.0
within_by_turn = 12
under_sink_by_turn = 18
colonists = [[12, 4], [22, 12]]

# Ticket #51: Diaspora is 30 Colonists off Earth, so the pace runs to 30.
[pace.arkwrights]
first = [[6, 4], [12, 12], [18, 22], [24, 30]]
colonists = [[12, 4], [22, 12]]

# Ticket #51: the pace is in the Archive's first Victory part. Ticket #68 (version 0.05.5): that is
# Research paid into the Archive, 80 in all, over a thirty-six-turn game.
[pace.archivists]
first = [[10, 20], [18, 40], [26, 60], [32, 80]]
colonists = [[12, 4], [22, 12]]

[thresholds]
attack_odds = 0.6
evade_damage_fraction = 0.6667
influence_step = 5
# Ticket #75 (version 0.05.5): what a state another Faction holds is worth on the AI's Influence
# target list, as a share of a neutral one's worth. 0.6 until now; at 0.3 a held place is attacked
# only when no neutral one is worth having.
held_state_weight = 0.3
# Ticket #84 (version 0.06.0): as Research Lead the AI picks its Victory gate once its first part
# is past this fraction of its bar, or from this turn, whichever comes first.
gate_pick_fraction = 0.5
gate_pick_turn = 24

# Tech picks as Research Lead (spec 16.4): `order` first, then the cheapest available that is not
# `never`, and `last` only when nothing else is left.

[tech_picks.prospectors]
order = ["deep_mining", "efficient_grids", "automated_refining", "clean_propellant", "efficient_transit"]
last = "clean_power"
never = "green_consensus"

# Ticket #77 (version 0.05.5): Coastal Engineering second, so the Sea Wall (10 Research on rung 1
# since ticket #69) arrives before the sea takes the coast around turn 13, not around turn 17 as
# the cheapest Tech left.
[tech_picks.custodians]
# Ticket #201 (version 0.08.1): Civil Defense joins the list. A Tech nobody weights is picked only
# by the cheapest-remaining fallback -- which is exactly how The Upload got chosen in the game that
# opened ticket #201 -- and the Custodians are the seat that most wants to keep what it holds: they
# lose their start Region in up to 12 seeds of 20.
order = ["public_science", "coastal_engineering", "efficient_grids", "clean_power", "green_consensus", "civil_defense", "clean_manufacturing"]

# Ticket #51: the Arkwrights want room, cheap upkeep and cheap transits.
[tech_picks.arkwrights]
order = ["expanded_habitats", "closed_loop_colonies", "efficient_transit"]

# Ticket #51: the Archivists want Research and a quiet world.
[tech_picks.archivists]
order = ["public_science", "efficient_grids", "coastal_engineering", "green_consensus", "civil_defense"]
