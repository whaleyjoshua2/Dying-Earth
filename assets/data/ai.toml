# Spec section 16. Base weights per action, then the multipliers, pace schedule, thresholds and Tech picks.
# Ticket #50 (version 0.05): every game seats four Factions, so weights, pace and Tech picks are
# keyed per Faction id. A missing table refuses to start, naming the Faction.
# Ticket #50 also removed the denial multiplier: each AI pursues its own Victory Condition and
# never spends a multiplier on holding a rival back.

# Ticket #52 (version 0.05): `relief` pays Relief on a state the seat directs once its Unrest is 6
# or more, one point per 10 Ducats it can spare, at the opportunity multiplier from 9;
# `build_constabulary` raises one where Unrest is 5 or more and a slot is free, at the threat
# multiplier in a state it has just Occupied; `resettle` steers this turn's refugee flows into a
# calm state of its own (Unrest under 3) while the world's population is falling.
#
# Ticket #54 (version 0.05): `restoration` is gone with the order. `build_scrubber` replaces it for
# the Custodians and carries the same Stabilization victory-gap multiplier, offered on a controlled
# state under its Scrubber cap while the seat's Energy is not already tight. `mothball` fires when
# an Energy shortfall is within one turn, on the highest-upkeep Facility or Module that produces
# nothing, and for a Custodian behind on Stabilization with Scrubbers standing and a run of 0 on its
# dirtiest Facility instead. `restart` fires once Energy is back above two turns' upkeep, and
# `decommission` only on a mothballed building that cannot be restarted yet. `leapfrog` is the
# Custodians on their most populous controlled state once they hold more than 60 Ducats;
# `strip_permit` is the Prospectors on their highest-output state while they are behind on the
# Extraction pace.

[weights.prospectors]
build_scrubber = 0
mothball = 3
restart = 4
decommission = 1
leapfrog = 0
strip_permit = 7
relief = 4
build_constabulary = 5
resettle = 2
fund_archive = 0
build_archive_stage = 0
build_producer = 8
raise_industry = 9
build_research_lab = 3
build_habitat = 5
build_launch_site_or_shipyard = 6
build_colony_ship = 6
build_warship = 5
build_army_or_barracks = 5
build_influence = 6
influence = 5
transit = 6
load_unload = 6
found_colony = 9
stance_attack = 4
stance_intercept = 3
stance_hold = 2
stance_evade = 1

[weights.custodians]
build_scrubber = 8
mothball = 3
restart = 4
decommission = 1
leapfrog = 5
strip_permit = 0
relief = 6
build_constabulary = 6
resettle = 2
fund_archive = 0
build_archive_stage = 0
build_producer = 6
raise_industry = 3
build_research_lab = 8
build_habitat = 7
build_launch_site_or_shipyard = 6
build_colony_ship = 8
build_warship = 3
build_army_or_barracks = 4
build_influence = 6
influence = 8
transit = 6
load_unload = 6
found_colony = 9
stance_attack = 2
stance_intercept = 3
stance_hold = 3
stance_evade = 1

