# Spec section 16. Base weights per action, then the multipliers, pace schedule, thresholds and Tech picks.
# Ticket #50 (version 0.05): every game seats four Factions, so weights, pace and Tech picks are
# keyed per Faction id. A missing table refuses to start, naming the Faction.
# Ticket #50 also removed the denial multiplier: each AI pursues its own Victory Condition and
# never spends a multiplier on holding a rival back.

[weights.prospectors]
fund_archive = 0
build_archive_stage = 0
build_producer = 8
raise_industry = 9
build_research_lab = 3
build_habitat = 5
build_launch_site_or_shipyard = 6
build_colony_ship = 6
build_warship = 5
build_army_or_barracks = 5
build_influence = 6
influence = 5
transit = 6
load_unload = 6
found_colony = 9
restoration = 0
stance_attack = 4
stance_intercept = 3
stance_hold = 2
stance_evade = 1

[weights.custodians]
fund_archive = 0
build_archive_stage = 0
build_producer = 6
raise_industry = 3
build_research_lab = 8
build_habitat = 7
build_launch_site_or_shipyard = 6
build_colony_ship = 8
build_warship = 3
build_army_or_barracks = 4
build_influence = 6
influence = 8
transit = 6
load_unload = 6
found_colony = 9
restoration = 7
stance_attack = 2
stance_intercept = 3
stance_hold = 3
stance_evade = 1

# Ticket #51: the Arkwrights spread. Habitats, Colony Ships, stations and founding are all 9;
# Influence is 5, since they buy passage rather than allegiance.
[weights.arkwrights]
fund_archive = 0
build_archive_stage = 0
build_producer = 6
raise_industry = 3
build_research_lab = 6
build_habitat = 9
build_launch_site_or_shipyard = 9
build_colony_ship = 9
build_warship = 3
build_army_or_barracks = 4
build_influence = 6
influence = 5
transit = 6
load_unload = 6
found_colony = 9
restoration = 0
stance_attack = 2
stance_intercept = 3
stance_hold = 3
stance_evade = 1

# Ticket #51: the Archivists research and build the Archive.
[weights.archivists]
fund_archive = 8
build_archive_stage = 9
build_producer = 6
raise_industry = 3
build_research_lab = 9
build_habitat = 7
build_launch_site_or_shipyard = 6
build_colony_ship = 8
build_warship = 3
build_army_or_barracks = 4
build_influence = 6
influence = 8
transit = 6
load_unload = 6
found_colony = 9
restoration = 0
stance_attack = 2
stance_intercept = 3
stance_hold = 3
stance_evade = 1

[multipliers]
victory_gap_max = 3.0
threat = 2.0
opportunity = 2.0
energy_shortage_bonus = 2

# Pace (spec 16.3), stretched to twenty-four turns on ticket #27 and keyed per Faction on #50.
# `first` is the Faction's first Victory part by turn, as [turn, value]; a Faction whose first part
# is a Stabilization run has no useful interpolation, so it names ppm figures instead: within
# `within_ppm` of the Sink by `within_by_turn`, and under it by `under_sink_by_turn`.
# `colonists` is the Colonists off Earth the Faction should hold, as [turn, colonists].

[pace.prospectors]
first = [[6, 40], [12, 150], [18, 320], [24, 500]]
colonists = [[12, 4], [22, 12]]

[pace.custodians]
within_ppm = 4.0
within_by_turn = 12
under_sink_by_turn = 18
colonists = [[12, 4], [22, 12]]

# Ticket #51: Diaspora is 30 Colonists off Earth, so the pace runs to 30.
[pace.arkwrights]
first = [[6, 4], [12, 12], [18, 22], [24, 30]]
colonists = [[12, 4], [22, 12]]

# Ticket #51: the Archive is four stages, and the pace is in stages complete.
[pace.archivists]
first = [[8, 1], [13, 2], [18, 3], [22, 4]]
colonists = [[12, 4], [22, 12]]

[thresholds]
attack_odds = 0.6
evade_damage_fraction = 0.6667
influence_step = 5

# Tech picks as Research Lead (spec 16.4): `order` first, then the cheapest available that is not
# `never`, and `last` only when nothing else is left.

[tech_picks.prospectors]
order = ["deep_mining", "efficient_grids", "automated_refining", "clean_propellant", "efficient_transit"]
last = "clean_power"
never = "green_consensus"

[tech_picks.custodians]
order = ["public_science", "efficient_grids", "clean_power", "green_consensus", "clean_manufacturing"]

# Ticket #51: the Arkwrights want room, cheap upkeep and cheap transits.
[tech_picks.arkwrights]
order = ["expanded_habitats", "closed_loop_colonies", "efficient_transit"]

# Ticket #51: the Archivists want Research and a quiet world.
[tech_picks.archivists]
order = ["public_science", "efficient_grids", "green_consensus"]
