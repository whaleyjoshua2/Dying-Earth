[multipliers]
victory_gap_max = 3.0
threat = 2.0
opportunity = 2.0
energy_shortage_bonus = 2
# Ticket #181 (version 0.08.0): the bias a seat gets toward its OWN Unique Facility over the common
# counterpart -- the designer asked for "only a slight bias", and slight is what this is. It is kept
# small on purpose: ticket #41 taught the AI to chase Ducats and it cost the Custodians every win in
# twenty seeds, because a Bank on turn 1 displaced the Research Lab.
unique_bias = 1.15
# Ticket #182: the Prospectors are the exception to that bias. An Investment Bank pays 1% of the
# Venture Capital Fund's balance, so its worth grows with the Fund, and the computer's appetite is
# made to grow with it: the weight is multiplied by 1 + balance x this. At the measured median Fund
# of 400 by turn 24 that is x1.8, and at 1000 -- the bar itself -- x3.0. Early, with an empty Fund,
# an Investment Bank is worth nothing and loses to the Factory that fills the Fund, which is right.
investment_bank_per_fund = 0.002
# Ticket #209 (version 0.08.1): the Archive may no longer stand in Earth orbit, which is the only
# place it has ever stood -- ordered there on turn 1 in 80 of 80 measured games. Narrowing the rule
# stops the computer ordering in orbit, because its Archive push already filters on the same
# function, but nothing in it makes the Archivists GO anywhere. They already weight founding a
# Colony at 9 and a Colony Ship at 8 and never cash either in, since Antarctica and Earth orbit are
# so much cheaper than a transit that nothing further ever wins the comparison. So while they have
# nowhere the Archive may stand, the whole chain that carries them to one -- Colony Ship, Launch
# Site or Shipyard, load, transit, founding -- is multiplied by this. It applies to no other
# Faction and stops the moment they hold such a place. Ticket #192's warning that a computer not
# taught the new move wins nothing at all proved right; this is the same shape, so the appetite is
# added deliberately rather than hoped for.
#
# 5.0, chosen by sweeping it. At 2.0 the Archivists won 2 games of 80 and the Archive stood in 40;
# at 5.0 they win 5 and it stands in 37 -- so the appetite is NOT what binds them, and more of it
# buys very little. What binds them is the journey itself, which eats about twenty turns of a
# thirty-six-turn game. 5.0 was taken anyway, at the designer's word, because the whole table reads
# better there than at any figure measured so far: Custodians 43, Prospectors 13, Arkwrights 7,
# Archivists 5, against the 58 / 18 / 3 / 0 this version started from, with no seat left on nothing.
#
# The lever held in reserve, if the Archivists are ever to be lifted without loosening the rule, is
# `banked_before_built` in modules.toml. It caps the Archive fund at a quarter of the 80 the Archive
# wants until the Module physically stands, and the sweeps show the fund sitting at exactly that cap
# -- 20 -- in three seatings of four. So the Archivists now spend the journey with their Labs'
# Research frozen as well as their Archive unplaceable: the rule charges them twice for one trip.
# That cap was set when the Archive was ordered on turn 1 in Earth orbit, where there was no journey
# to fund through, so its premise is gone even though the figure has not moved.
archive_needs_a_place = 5.0
# Ticket #332 (version 0.09.0): a build is ordered where the place's Widgets finish it soonest, the
# queue's depth as the gap. Every build candidate is weighed against the SAME build at the seat's
# other places by the Resolutions until this place's Widgets would complete it behind everything
# already in its queue (`turns_to_build`): the soonest place at full weight and every other at
# soonest / turns, so a Power Plant goes to the Region with the Factory and the empty queue rather
# than to the one making a Widget a turn or the one two builds deep. It never weighs one build
# against another: a Shipyard that can only stand on the seat's one station is at full weight
# there. A first cut discounted every build by its turns outright, and on a starting station, one
# Widget a turn from its Core, that halved the opening Habitat of ticket #290 and quartered the
# Solar Array of ticket #89 (two tests red, measured). Never below `build_pace_floor`, so a slow
# place still builds when the fast one is full, and a place that makes nothing (a starved Colony)
# sits at the floor. A discount and never a lift, on the lesson of ticket #232: a factor that can
# only shrink a weight cannot put 329 of anything on the board. The two Widget makers -- the
# Factory on Earth and the Factory Module -- are exempt, since a slow place is exactly where one is
# wanted; so is the early Mine, whose Region is chosen by its lean.
build_pace_floor = 0.25

# Pace (spec 16.3), stretched to twenty-four turns on ticket #27 and keyed per Faction on #50.
# `first` is the Faction's first Victory part by turn, as [turn, value]; a Faction whose first part
# is a Stabilization run has no useful interpolation, so it names ppm figures instead: within
# `within_ppm` of the Sink by `within_by_turn`, and under it by `under_sink_by_turn`.
# `colonists` is the Colonists off Earth the Faction should hold, as [turn, colonists].

# Ticket #72 (version 0.05.5): the pace is Materials banked in the Venture Capital Fund, by turn 34
# of thirty-six; the AI sets its share each turn to stay on it.
# Ticket #182 (version 0.08.0): the bar moved from 750 to 1000, so the whole schedule is RESCALED by
# 1000/750 rather than given a new last number -- it is what makes the computer set its banking share
# every turn, and leaving the early marks where they were would have it bank too little until turn 27
# and then find the last stretch impossible.
[pace.prospectors]
first = [[9, 133], [18, 333], [27, 600], [34, 1000]]
colonists = [[12, 4], [22, 12]]

[pace.custodians]
within_ppm = 4.0
within_by_turn = 12
under_sink_by_turn = 18
colonists = [[12, 4], [22, 12]]

# Ticket #51: Diaspora is 30 Colonists off Earth, so the pace runs to 30.
[pace.arkwrights]
first = [[6, 4], [12, 12], [18, 22], [24, 30]]
colonists = [[12, 4], [22, 12]]

# Ticket #51: the pace is in the Archive's first Victory part. Ticket #68 (version 0.05.5): that is
# Research paid into the Archive, 80 in all, over a thirty-six-turn game.
[pace.archivists]
first = [[10, 20], [18, 40], [26, 60], [32, 80]]
colonists = [[12, 4], [22, 12]]

[thresholds]
# Ticket #345 (version 0.09.1): FIRST TO A BODY, on the computer's side. `first_windfall_worth`
# is what one Influence of an unclaimed Body's windfall counts for when a seat picks where to
# send a loaded Colony Ship, in the units a Colony Slot's yields are weighed in -- a slot is worth
# 0.5 to 1.75 on that scale, so this figure times 15 (Mars) or 20 (the Mars moons) is what has to
# outweigh the Moon's better ground and its one-turn leg. `first_found_weight` multiplies the
# founding appetite itself at a Body still unclaimed, so a Ship that has arrived commits to the
# ground rather than parking its load in a Colony of its own.
#
# Without these two the rule would not exist in play: the destination list was yields against
# flight time, the Moon won it from turn one, and no computer seat founded a Colony anywhere in
# the Mars system in eighty measured games. Both fall away the moment a Body is claimed, so the
# pull is toward whatever world is still unsettled and never toward one that is.
first_windfall_worth = 0.12
first_found_weight = 1.5
attack_odds = 0.6
# Ticket #284 (version 0.08.5): every seat may attack a place it did not lose, on the odds, given a
# cause: a neutral place needs none, and a place a rival holds wants Relations toward that rival at
# or below this score -- Cold or worse, the Smear's gate. A seat that keeps every rival Neutral is
# marched on by nobody. One new war a turn per seat.
war_cause = -5
evade_damage_fraction = 0.6667
influence_step = 5
# Ticket #75 (version 0.05.5): what a state another Faction holds is worth on the AI's Influence
# target list, as a share of a neutral one's worth. 0.6 until now; at 0.3 a held place is attacked
# only when no neutral one is worth having.
held_state_weight = 0.3
# Ticket #336 (version 0.09.0): what a rival's Colony is worth on the same list, read as this price
# divided by the price the seat would actually pay for it -- CHEAPEST FIRST, where the rule from
# ticket #50 ranked by fewest Colonists and never read the threshold at all. Without this the
# doubling would have left the seats pouring their Allotment into places they cannot afford. The
# figure is the price of a starting two-Colonist place under the new rule (40 + 20 x 2), so a
# Colony at that price weighs 1.0 and an empty one 2.0 -- the band the fewest-Colonists rule ran in
# (1.0 to 3.0), which keeps a Colony's worth against a Region's where it was.
colony_price_pivot = 80.0
# Ticket #84 (version 0.06.0): as Research Lead the AI picks its Victory gate once its first part
# is past this fraction of its bar, or from this turn, whichever comes first.
gate_pick_fraction = 0.5
# Ticket #236 (version 0.08.3): the AI weighs the Tech under research before deciding what to keep
# back. A Tech it wants -- its own Victory gate, or anything on its `order` list -- and it gives
# everything, which also earns the shared pot's reward. A Tech it is indifferent to and it keeps a
# little, staying above the 85% line. A Tech it never wanted, or leaves until last, and it takes
# its whole cap and wears the penalty knowingly.
#
# The designer asked for exactly this: "the ai need to weigh the benefit of the new tech to which
# they contributing". Before it, every seat sat at its cap from turn 2 -- measured, 24 to 28 turns
# of 36 below any threshold worth having -- so the shared-pot rule had no line left to draw.
directive_when_wanted = 0
directive_when_indifferent = 10
gate_pick_turn = 24
# Ticket #332 (version 0.09.0): every seat wants a Mine early in its most Materials-lean Region at
# the Factory's weight. Through `early_mine_turn`, while the seat directs fewer Mines on Earth
# (standing or on order) than `early_mines`, the Mine in the Region where one would make the most
# -- a Materials-lean Region makes six a turn where any other makes four -- takes the Producer
# weight the Factory has always had, the victory-gap multiplier as the Materials bootstrap does,
# and the opportunity multiplier as the opening Habitat does (ticket #290): an opening is played
# once. Two, because every seat whose start Region holds a Factory holds a Mine beside it from
# turn 1 (the starting board of ticket #332), so the early Mine is the second; a seat that starts
# without one (the Arkwrights in Saudi Arabia, income nought until turn 8 in the probe that opened
# this lane) wants both. Eight turns is the window before the first Colony is founded (median 10).
early_mine_turn = 8
early_mines = 2
# Ticket #332: a Factory Module is wanted at a Colony whose queue is this many builds deep, or where
# a Ship is wanted (a Shipyard standing or on order); nowhere else, since its four Widgets a turn
# are lost at a Colony with nothing under way. Where wanted it takes the victory-gap and
# opportunity multipliers: a queue two deep is the moment, and it speeds whatever the seat is
# behind on there.
factory_module_queue_depth = 2
# Ticket #335 (version 0.09.0): a leg names its destination orbit before it leaves, and low orbit is
# the default -- the lane to the ground, and the one orbit Orbital Control is held in. A warship
# flies to a rival station's ring instead only where the seat means to shut that station AND this
# many of its warships are already holding low orbit at that Body (counting the ones on the way that
# named no ring), so the ground the seat wants is never given up for a Blockade above it. One,
# because Orbital Control is one seat alone with a warship in low orbit: one hull holds the lane,
# and the hull after it is the one with nothing to lose by going up. Measured at 0.08.8 every
# warship leg named the richest rival station whatever the seat thought of its holder, so low orbit
# stood empty and the ground was never shut by anybody.
low_orbit_warships = 1
# Ticket #346 (version 0.09.1): a Battle costs every hull in it `battle_fuel`, so a seat now weighs
# that Fuel against the prize before it opens one. This MULTIPLIES THE ODDS the seat reads against
# `attack_odds` above, when BOTH of these hold: paying the charge would leave every armed hull the
# seat has in the contested orbit under the Battle bar -- unable to hold the orbit, blockade or
# intercept, and halved in the next fight -- and the seat holds nothing at that Body, neither a
# Colony on the ground nor a station of its own, so there is nothing the orbit was wanted for.
# That is the "strands its fleet for nothing" case, and only that one: a seat with a place of its
# own below pays the Fuel at full appetite, because the orbit is the thing it came for.
#
# A weight and not a prohibition: it is a figure here rather than an `if` in the code, and a
# discounted Battle is one that has to look BETTER to be worth a tank, not one that is forbidden.
# 0.2 means such a Battle would have to read 300% odds, which no Battle does, so in practice the
# seat holds instead; 0.9 would raise the bar it reads from 60% to 67%; 1.0 turns the weighing off
# altogether and restores the reading this ticket found. It is set low because the case it catches
# is a fleet buying a fight it cannot then hold the orbit with, which is a bad trade at any odds.
battle_fuel_weight = 0.2

# Tech picks as Research Lead (spec 16.4): `order` first, then the cheapest available that is not
# `never`, and `last` only when nothing else is left.

[tech_picks.prospectors]
order = ["deep_mining", "efficient_grids", "automated_refining", "clean_propellant", "efficient_transit"]
last = "clean_power"
never = "green_consensus"

# Ticket #77 (version 0.05.5): Coastal Engineering second, so the Sea Wall (10 Research on rung 1
# since ticket #69) arrives before the sea takes the coast around turn 13, not around turn 17 as
# the cheapest Tech left.
[tech_picks.custodians]
# Ticket #201 (version 0.08.1): Civil Defense joins the list. A Tech nobody weights is picked only
# by the cheapest-remaining fallback -- which is exactly how The Upload got chosen in the game that
# opened ticket #201 -- and the Custodians are the seat that most wants to keep what it holds: they
# lose their start Region in up to 12 seeds of 20.
order = ["public_science", "coastal_engineering", "efficient_grids", "clean_power", "green_consensus", "civil_defense", "clean_manufacturing"]

# Ticket #51: the Arkwrights want room, cheap upkeep and cheap transits.
[tech_picks.arkwrights]
order = ["expanded_habitats", "closed_loop_colonies", "efficient_transit"]

# Ticket #51: the Archivists want Research and a quiet world.
[tech_picks.archivists]
order = ["public_science", "efficient_grids", "coastal_engineering", "green_consensus", "civil_defense"]
