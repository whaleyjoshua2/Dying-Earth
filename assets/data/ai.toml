# Ticket #51: the Archivists research and build the Archive.
[weights.archivists]
build_scrubber = 0
build_sea_wall = 4
mothball = 3
restart = 4
decommission = 1
leapfrog = 0
strip_permit = 0
relief = 5
build_constabulary = 5
resettle = 2
