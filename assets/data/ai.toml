build_archive = 9
# Ticket #192 (version 0.08.0): the Upload is the Archivists' second Victory part now, not a
# side errand, so it outranks raising the Module itself: there is no reason ever to hold people
# back from a complete Archive, and a seat that does not upload wins nothing at all.
upload = 10
build_producer = 6
raise_industry = 3
build_research_lab = 9
build_observatory = 12
# Ticket #80: the Archivist AI raises its Observatory a load earlier than the others.
observatory_colonists = 4
build_habitat = 7
