# Spec section 11. The Climate Model's constants.

starting_co2 = 420.0
base_temperature = 1.2
degrees_per_ppm_step = 0.5
# Ticket #27 (version 0.02): re-paced for twenty-four turns by a sweep of the Sink and this step,
# re-run on ticket #28 after the two new Nation States of #26 added four emitting start Facilities.
# At 40 ppm the Custodian-versus-Prospector game collapsed by turn 10. At 90 it collapses in 17 of
# 20 seeds between turns 15 and 21, median 16; 100 would give 10 of 20 with a median of 19.
# Ticket #50 (version 0.05): four Factions' industry on eight Nation States adds about a third more
# Emissions, so the step is re-swept with four seats. At 90 a Prospector holding Asia collapses the
# world on turn 13 in every seed; at 120 that seating collapses on turns 16 to 18, the other
# seatings end at +2.5 to +2.9 C, and a Custodian starting outside Asia collapses on turn 18. At
# 150 half the seatings end comfortable at +2.3. The sweep tables are in the 0.05 dev diary.
ppm_step = 120.0
natural_sink = 6.0
collapse_line = 3.0
temperature_lag_fraction = 0.5
population_growth = 0.01
population_loss_per_tenth_degree = 0.0015
population_emissions_per_hundred_million = 0.1
launch_emissions = 2.0
sea_level_thresholds = [1.8, 2.3, 2.8]
