# Ticket #57 (version 0.05). The real sky the Solar System Map draws, and the real launch windows
# a transit between the Earth system and the Mars system pays for.
#
# The elements are JPL's "Keplerian Elements for Approximate Positions of the Major Planets"
# (Standish), the table valid 1800 AD to 2050 AD, at the J2000 epoch with rates per Julian century:
#   https://ssd.jpl.nasa.gov/planets/approx_pos.html
# `earth` is the Earth-Moon barycentre, which is the row that table carries. Angles are in degrees,
# `a` in astronomical units, every `_rate` per Julian century. The elements, the reference positions
# they were checked against and the real launch windows are in docs/research/earth-mars-ephemeris.md.
#
# The Moon reads Earth's row and Phobos and Deimos read Mars's: at this scale a satellite stands
# where its parent stands.

[[planet]]
id = "earth"
a = 1.00000261
a_rate = 0.00000562
e = 0.01671123
e_rate = -0.00004392
inclination = -0.00001531
inclination_rate = -0.01294668
mean_longitude = 100.46457166
mean_longitude_rate = 35999.37244981
perihelion_longitude = 102.93768193
perihelion_longitude_rate = 0.32327364
node_longitude = 0.0
node_longitude_rate = 0.0

[[planet]]
id = "mars"
a = 1.52371034
a_rate = 0.00001847
e = 0.09339410
e_rate = 0.00007882
inclination = 1.84969142
inclination_rate = -0.00813131
mean_longitude = -4.55343205
mean_longitude_rate = 19140.30268499
perihelion_longitude = -23.94362959
perihelion_longitude_rate = 0.44441088
node_longitude = 49.55953891
