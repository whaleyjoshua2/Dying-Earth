# What a transit between the Earth system and the Mars system costs. The window offset is the
# signed difference, in degrees, between the phase angle now (Mars's heliocentric longitude less
# Earth's) and the Hohmann departure angle. At the window a transit costs the Hohmann flight and
# the card's Fuel; away from it, turns and Fuel both rise with the offset.
[transit]
# The minimum-energy Earth-to-Mars transfer.
days_at_window = 259.0
# The departure phase angle that flight wants, and the one the return wants. Both are read in the
# same direction, Mars's heliocentric longitude less Earth's. The ticket wrote the return as -75
# with Earth leading; the research file (section 4.3) works it out from the ephemeris as +75, with
# Earth 75 degrees BEHIND Mars at the moment of departure and overtaking during the cruise. The
# magnitude the ticket gave is right; only the direction is turned round, and the two legs must
# read the phase angle the same way or the return window lands two years out.
hohmann_angle = 44.0
return_hohmann_angle = 75.0
# What a degree off the window costs: days added to the flight, and a fraction of the card's Fuel.
days_per_degree = 1.5
fuel_per_degree = 0.00833333
# A Turn is a calendar month; the flight is charged in months of this length.
# Ticket #67 (version 0.05.5): a Turn is two calendar months, so sixty days; the Hohmann flight of
# 259 days is five turns and the window cycle of 780 days thirteen.
days_per_turn = 60.0
# However far from the window, a transit is never longer than this.
# Ticket #67: the same cap of a year and a half, nine turns of sixty where it was eighteen of thirty.
max_turns = 9
# Earth and Mars come back to the same phase angle this often: the cycle a window is looked for in.
synodic_days = 779.9

# Ticket #93 (version 0.06.0): the same for a transit between the Earth system and Venus, from
# docs/research/venus-ephemeris.md. The phase angle is Venus's heliocentric longitude less Earth's:
# the flight out wants Venus 54 degrees behind Earth, the flight home Venus 36 degrees behind.
# The Hohmann flight is 146 days, three turns of sixty; the windows fall at turns 9, 18 and 28.
[transit_venus]
days_at_window = 146.08
hohmann_angle = -54.03
return_hohmann_angle = -36.03
days_per_degree = 1.5
fuel_per_degree = 0.00833333
days_per_turn = 60.0
max_turns = 9
synodic_days = 583.92

# Ticket #486 (version 0.09.8): the same for a transit between Venus and the Mars system, which no
# leg flew until now. The phase angle is Mars's heliocentric longitude less Venus's. The Hohmann
# flight between the two orbits is 217.5 days, four turns of sixty: in that time Mars moves 113.7
# degrees, so the flight out wants Mars 66.3 degrees ahead of Venus; Venus moves 347.7, so the
# flight back wants Mars 167.7 degrees ahead. The two come round every 333.9 days.
[transit_venus_mars]
days_at_window = 217.5
hohmann_angle = 66.3
return_hohmann_angle = 167.7
days_per_degree = 1.5
fuel_per_degree = 0.00833333
days_per_turn = 60.0
max_turns = 9
synodic_days = 333.92

# Ticket #502 (version 0.1.0.0): the new worlds' crossings that have a window, each the same shape,
# from docs/research/new-worlds.md section 1.2. The phase angle is the second-named's longitude less
# the first-named's, for the flight out and the flight back alike; a far orbit reads Earth's rows.
# However far from the window, a crossing is never longer than its window's turns and four more, or
# nine where that is less (the cap the Mars and Venus crossings keep).
[[crossing]]
between = ["earth", "mercury"]
days_at_window = 105.5
hohmann_angle = 108.3
return_hohmann_angle = -76.0
days_per_degree = 1.5
fuel_per_degree = 0.00833333
days_per_turn = 60.0
max_turns = 9
synodic_days = 115.9

