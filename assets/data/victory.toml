# Spec section 15.
# Ticket #50: each Faction's first Victory part and its bar now live on its own card in
# factions.toml (victory_first). This one is kept as the reference figure the Custodian card quotes;
# the engine reads the cards. Ticket #72 (version 0.05.5): the Extraction Total is retired for the
# Prospectors' Venture Capital Fund (2000 DUCATS on their card since ticket #240, version
# 0.08.3; it was 1000 Materials from ticket #182, version 0.08.0).
stabilization_turns = 3
# Off-world Presence is the same bar for every Faction.
off_world_presence = 12
# Ticket #27 (version 0.02): twenty-four turns of one month. Ticket #67 (version 0.05.5): thirty-six
# turns of two months, so the game runs six years; every build time, transit time and per-turn
# figure stays what it was in turns.
turns = 36
# Ticket #57 (version 0.05): the game begins on 1 January 2030. Ticket #67: a Turn is
# `months_per_turn` calendar months and is named by its first month alone, so turn 1 is January
# 2030, turn 2 March 2030 and turn 36 November 2035; each turn's sky is read at the first instant
# of its first month.
start_year = 2030
start_month = 1
months_per_turn = 2

# Ticket #261 (version 0.08.4): the rival's Moment fires when a rival's score -- the lower of its
# two parts' fractions -- reaches this share, and again when one part is met with the other short.
# Once a step, rivals only. The suggestion said half, three quarters and one turn from; the designer
# took three quarters and the one step the engine can state exactly.
rival_moment_share = 0.75
