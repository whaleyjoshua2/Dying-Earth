[workspace]
members = [".", "engine"]
resolver = "2"

[package]
name = "dying-earth"
version = "0.1.0"
edition = "2024"
description = "Dying Earth, the First Playable"
default-run = "dying-earth"

[dependencies]
dying-earth-engine = { path = "engine" }
bevy = "=0.19.1"
bevy_egui = "=0.42.0"
image = "0.25"

[profile.release]
opt-level = 3

# Dependencies stay optimised in dev builds so the game is playable while iterating.
[profile.dev.package."*"]
opt-level = 3
