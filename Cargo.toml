[workspace]
members = [".", "engine"]
resolver = "2"

[package]
name = "dying-earth"
version = "0.1.0"
edition = "2024"
description = "Dying Earth, the First Playable"
default-run = "dying-earth"

[dependencies]
dying-earth-engine = { path = "engine" }
bevy = "=0.19.1"
bevy_egui = "=0.42.0"
image = "0.25"
# Ticket #59: the saves folder, %LOCALAPPDATA%\DyingEarth\data\saves, found the way Microsoft's
# own guidance for game developers asks for it rather than beside the executable.
directories = "6"
# Ticket #109 (version 0.07.0): the resource icons are game-icons.net SVGs, rendered at runtime so
# any future icon is a drop-in and every one scales to whatever size the interface asks for. Chosen
# by the designer over baking PNGs at build time, to make later interface work easier. tiny-skia,
# which does the rasterising, was already in the tree.
resvg = "0.45"

[profile.release]
opt-level = 3

# Dependencies stay optimised in dev builds so the game is playable while iterating.
[profile.dev.package."*"]
opt-level = 3

# Ticket #125 (version 0.07.2): the Region mask is drawn from Natural Earth's GeoJSON by
# examples/prep_assets.rs, which needs a JSON reader. serde_json was already in Cargo.lock through
# bevy; naming it here makes it available to the example and puts nothing new in the shipped game.
[dev-dependencies]
serde_json = "1"
